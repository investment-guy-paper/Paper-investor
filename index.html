<style>*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0A1017; }
body { -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; background: none; border: none; padding: 0; color: inherit; }
button:disabled { cursor: default; }
input { font: inherit; }
:focus-visible { outline: 2px solid #D6A64A; outline-offset: 2px; }

.flex { display: flex; }
.grid { display: grid; }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.flex-1 { flex: 1 1 0%; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.items-end { align-items: flex-end; }
.items-baseline { align-items: baseline; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-1 { gap: .25rem; }
.gap-2 { gap: .5rem; }
.gap-3 { gap: .75rem; }

.w-full { width: 100%; }
.w-24 { width: 6rem; }
.w-40 { width: 10rem; }
.max-w-lg { max-width: 32rem; }
.mx-auto { margin-left: auto; margin-right: auto; }
.h-1 { height: .25rem; }
.h-1\.5 { height: .375rem; }

.p-3 { padding: .75rem; } .p-4 { padding: 1rem; } .p-5 { padding: 1.25rem; }
.px-1 { padding-left: .25rem; padding-right: .25rem; }
.px-2 { padding-left: .5rem; padding-right: .5rem; }
.px-3 { padding-left: .75rem; padding-right: .75rem; }
.px-4 { padding-left: 1rem; padding-right: 1rem; }
.py-1 { padding-top: .25rem; padding-bottom: .25rem; }
.py-1\.5 { padding-top: .375rem; padding-bottom: .375rem; }
.py-2 { padding-top: .5rem; padding-bottom: .5rem; }
.py-3 { padding-top: .75rem; padding-bottom: .75rem; }
.pt-3 { padding-top: .75rem; } .pt-5 { padding-top: 1.25rem; }
.pb-28 { padding-bottom: 7rem; }
.mb-1 { margin-bottom: .25rem; } .mb-2 { margin-bottom: .5rem; }
.mb-3 { margin-bottom: .75rem; } .mb-4 { margin-bottom: 1rem; } .mb-5 { margin-bottom: 1.25rem; }
.mt-1 { margin-top: .25rem; } .mt-2 { margin-top: .5rem; }
.mt-3 { margin-top: .75rem; } .mt-4 { margin-top: 1rem; }

.rounded { border-radius: .25rem; }
.rounded-md { border-radius: .375rem; }
.rounded-lg { border-radius: .5rem; }
.rounded-full { border-radius: 9999px; }
.rounded-t-2xl { border-top-left-radius: 1rem; border-top-right-radius: 1rem; }

.text-left { text-align: left; }
.text-right { text-align: right; }
.text-xs { font-size: .75rem; line-height: 1rem; }
.text-sm { font-size: .875rem; line-height: 1.25rem; }
.uppercase { text-transform: uppercase; }
.tracking-widest { letter-spacing: .1em; }
.whitespace-nowrap { white-space: nowrap; }

.fixed { position: fixed; }
.inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
.bottom-0 { bottom: 0; } .left-0 { left: 0; } .right-0 { right: 0; }
.z-50 { z-index: 50; }
.overflow-x-auto { overflow-x: auto; }
.overflow-y-auto { overflow-y: auto; }
.outline-none { outline: none; }
.opacity-40 { opacity: .4; }
.transition-opacity { transition: opacity .15s ease; }
.hover\:opacity-80:hover { opacity: .8; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* iOS standalone tuning */
html { background: #0A1017; height: 100%; }
body {
  min-height: 100%;

  -webkit-text-size-adjust: 100%;       /* stop Safari inflating type in landscape */
}

you are paying for growth that has to actually arrive."},"book value":{t:"Book value",d:"What the company owns minus what it owes, according to its accounts. Roughly, what would theoretically be left for shareholders if it sold everything and paid off all debts.",f:"Book value = total assets \u2212 total liabilities",ex:"Assets CHF 800m, debts CHF 500m \u2192 book value CHF 300m.",w:"It is a rough floor for asset-heavy businesses. It is nearly meaningless for software companies, whose real assets are code and people that never appear on the balance sheet."},"book value per share":{t:"Book value per share",d:"The book value divided by the number of shares \u2014 the accounting value behind one share.",f:"Book value per share = book value \xF7 number of shares",ex:"Book value CHF 300m, 15m shares \u2192 CHF 20 per share."},"P/B":{t:"P/B ratio (price to book)",d:"How much you pay relative to the accounting value of the company's assets.",f:"P/B = share price \xF7 book value per share",ex:"Price CHF 30, book value per share CHF 20 \u2192 P/B of 1.5.",w:"Below 1 means the market values the company at less than its stated assets \u2014 sometimes a bargain, more often a warning that those assets are not worth what the accounts claim."},ROE:{t:"ROE (return on equity)",d:"How much profit the company generates from the shareholders' money it holds. It measures how good the business is at turning capital into profit.",f:"ROE = net profit \xF7 shareholders' equity",ex:"Profit CHF 60m on equity of CHF 300m \u2192 ROE of 20%.",w:"Buffett looks for ROE consistently above 15% without much debt. High ROE year after year is evidence of a real competitive advantage rather than luck."},moat:{t:"Moat",d:"A durable advantage that stops competitors from stealing a company's profits \u2014 a brand people insist on, a network that gets better as it grows, or costs that make switching painful.",ex:"Leaving a bank means moving direct debits, cards and salary payments. That friction is a moat. A steel mill has none: buyers pick whoever is cheapest today.",w:"Without a moat, competition grinds profits down to nothing. It is the single thing that lets a business stay profitable for decades."},"margin of safety":{t:"Margin of safety",d:"Buying well below what you think something is worth, so that being wrong still doesn't ruin you.",f:"Margin of safety = (your value estimate \u2212 price) \xF7 your value estimate",ex:"You think it's worth CHF 100 and pay CHF 62 \u2192 a 38% margin of safety. Even if your estimate was 25% too optimistic, you still didn't overpay.",w:"Graham's central idea. It exists precisely because your forecast will sometimes be wrong."},"discount to value":{t:"Discount to value",d:"How far below your own estimate of a company's worth you are buying. It is the same idea as margin of safety, expressed as one percentage.",f:"Discount = (your value estimate \u2212 price) \xF7 your value estimate",ex:"You judge it worth CHF 100 and the price is CHF 62 \u2192 (100 \u2212 62) \xF7 100 = 38% discount. Note the upside is larger than the discount: 100 \xF7 62 \u2212 1 = 61% gain if price reaches value.",w:"It is your error budget. A 38% discount means your valuation could be 38% too optimistic and you still haven't overpaid. Demand a bigger discount when your estimate is shakier."},"intrinsic value":{t:"Intrinsic value",d:"What a business is genuinely worth based on the cash it will produce over its life \u2014 as opposed to what the market happens to be quoting today.",w:"Nobody can calculate it exactly. The point is to arrive at a rough range and then only buy well below it."},DCF:{t:"DCF (discounted cash flow)",d:"A method of valuing a business by estimating the cash it will produce in future years, then reducing those future amounts to what they're worth today.",f:"Value = sum of (future cash flow \xF7 (1 + discount rate)^years)",ex:"CHF 100 arriving in 5 years, with a 10% required return, is worth 100 \xF7 1.1\u2075 = about CHF 62 today.",w:"It forces you to write down your assumptions. Its weakness is that small changes in those assumptions swing the answer enormously."},"discount rate":{t:"Discount rate",d:"The annual return you demand for taking the risk. It converts future money into today's money.",ex:"If you want 10% a year, then CHF 110 next year is worth CHF 100 to you today.",w:"For a private investor the practical version is: 'I want 10% a year \u2014 what is the most I can pay?' A higher discount rate means you'll pay less."},WACC:{t:"WACC (weighted average cost of capital)",d:"The blended annual cost of the money a company uses, mixing what it pays lenders and what shareholders expect.",w:"Professionals use it as the discount rate. As a private investor you can skip it and simply use the return you personally require."},"terminal value":{t:"Terminal value",d:"In a valuation, the estimated worth of everything beyond the years you actually forecast \u2014 usually year 10 onwards.",w:"It often makes up 60\u201380% of the total answer, and it is the least knowable part. When someone's valuation looks precise, this is usually where the guesswork hides."},"free cash flow":{t:"Free cash flow",d:"The cash left over after the company has paid all its running costs and the investment needed to keep operating.",f:"Free cash flow = operating cash flow \u2212 capital expenditure",w:"Profit is an accounting opinion; cash is a fact. Dividends and debt repayments come out of cash, not out of reported profit."},"owner earnings":{t:"Owner earnings",d:"Buffett's version of true profit: what the owner could actually take out each year without the business shrinking.",f:"Owner earnings = net profit + depreciation \u2212 maintenance capex \xB1 working capital change",ex:"Profit 120, depreciation 40, maintenance capex 55, working capital up 10 \u2192 120 + 40 \u2212 55 \u2212 10 = 95.",w:"Reported profit often overstates what you can really pocket, especially in businesses that constantly need new machines."},capex:{t:"Capex (capital expenditure)",d:"Money spent on physical or long-lived things: machines, buildings, vehicles, equipment.",w:"A business needing heavy capex just to stand still keeps very little for its owners. Low-capex businesses compound far faster."},"maintenance capex":{t:"Maintenance capex",d:"The portion of capex needed just to keep the business at its current size \u2014 replacing worn-out equipment.",w:"This is a real cost of staying in business, so it must be subtracted from profit. Growth capex, which expands the business, is optional and treated separately."},"D&A":{t:"D&A (depreciation & amortisation)",d:"An accounting charge that spreads the cost of an asset over the years it is used, rather than all at once.",ex:"A CHF 100,000 machine lasting 10 years shows CHF 10,000 of depreciation each year, even though the cash left the company in year one.",w:"It reduces reported profit without any cash leaving that year, which is why you add it back when calculating owner earnings."},"working capital":{t:"Working capital",d:"The cash tied up in day-to-day operations \u2014 money sitting in unsold stock and in bills customers haven't paid yet.",w:"Growing companies swallow cash here. If it rises much faster than sales, customers may not be paying, which is a classic warning sign."},"net income":{t:"Net income",d:"The official bottom-line profit after every cost, interest and tax. Also called net profit or earnings.",w:"It is the starting point for most calculations, but it can be shaped by accounting choices. Always cross-check it against actual cash."},EBITDA:{t:"EBITDA",d:"Profit before interest, tax, depreciation and amortisation \u2014 an approximation of operating profit before financing and accounting effects.",w:"Useful for comparing companies with different debt levels, but it deliberately ignores real costs. Munger called it 'bullshit earnings' for exactly that reason."},"net debt":{t:"Net debt",d:"Total borrowings minus the cash the company holds.",f:"Net debt = total debt \u2212 cash",ex:"Debt CHF 500m, cash CHF 200m \u2192 net debt CHF 300m. A company with more cash than debt has 'net cash', which is a position of strength.",w:"Debt removes your ability to wait. A cheap company with heavy debt can go bankrupt before its value is recognised."},"net debt/EBITDA":{t:"Net debt / EBITDA (leverage ratio)",d:"How many years of rough operating profit it would take to repay everything a company owes. The standard test of whether a debt load is dangerous.",f:"Leverage = net debt \xF7 EBITDA",ex:"Net debt CHF 400m against EBITDA of CHF 100m \u2192 4\xD7. Four full years of operating profit, spent on nothing else at all, just to clear the borrowings.",w:"Under 2\xD7 is comfortable, 3\xD7 is stretched, above 4\xD7 the lenders effectively control the company. On a business with falling sales it is close to fatal: profits shrink, so the ratio worsens by itself, and the bank can refuse to refinance at the worst moment."},leverage:{t:"Leverage",d:"Using borrowed money to increase the size of a position \u2014 whether by a company or by an investor.",w:"It magnifies gains and losses equally, but only losses can force you to sell at the worst possible moment. It is the main reason clever investors go broke."},"debt/equity":{t:"Debt-to-equity ratio",d:"How much a company has borrowed compared with the shareholders' money in it.",f:"Debt/equity = total debt \xF7 shareholders' equity",ex:"Debt CHF 600m against equity of CHF 300m \u2192 2.0, meaning twice as much borrowed as owned.",w:"Above roughly 1 deserves scrutiny; high ratios can make return on equity look impressive while quietly making the company fragile."},dividend:{t:"Dividend",d:"A cash payment made from the company's profits to shareholders, usually quarterly or annually.",w:"It is not free money \u2014 the share price drops by roughly the payment amount. Real income comes from the dividend growing over time."},"dividend yield":{t:"Dividend yield",d:"The annual dividend as a percentage of the share price.",f:"Dividend yield = annual dividend per share \xF7 share price",ex:"CHF 1.50 dividend on a CHF 50 share \u2192 3%.",w:"A very high yield is usually a warning, not a bargain: the yield rose because the price collapsed, and a cut is often coming."},"payout ratio":{t:"Payout ratio",d:"The share of profit that gets paid out as dividends instead of being kept in the business.",f:"Payout ratio = dividends \xF7 profit (better: \xF7 free cash flow)",ex:"CHF 2 of dividends from CHF 5 of profit \u2192 40%.",w:"Below about 60% is generally safe. Above 100% means the company is paying dividends with borrowed money, and the dividend will eventually be cut."},"yield on cost":{t:"Yield on cost",d:"Today's dividend measured against the price you originally paid, not today's price.",ex:"You bought at CHF 50 with a CHF 1.50 dividend (3%). Fifteen years later the dividend is CHF 4.76 \u2014 a 9.5% yield on your original CHF 50.",w:"This is the actual mechanism behind long-term passive income. Dividend growth matters far more than the starting yield."},"total return":{t:"Total return",d:"Everything you earn from an investment: the price change plus dividends received.",w:"Judging an investment on price alone ignores years of dividends; judging on dividends alone ignores the capital you lost."},CAGR:{t:"CAGR (compound annual growth rate)",d:"The smoothed average yearly rate that turns a starting amount into an ending amount.",f:"CAGR = (end \xF7 start)^(1 \xF7 years) \u2212 1",ex:"CHF 10,000 becomes CHF 20,000 in 8 years \u2192 (2)^(1/8) \u2212 1 = about 9% a year.",w:"It is the only fair way to compare results over different time periods."},compounding:{t:"Compounding",d:"Earning returns on your previous returns, so growth accelerates over time.",ex:"CHF 10,000 at 8%: after year 1 you have CHF 10,800, and year 2 earns 8% on 10,800, not on 10,000. After 30 years it's roughly CHF 100,000.",w:"It is why starting at 18 is worth more than any stock-picking skill you might develop later. Time is the ingredient you can't buy back."},"rule of 72":{t:"Rule of 72",d:"A mental shortcut for how long money takes to double.",f:"Years to double \u2248 72 \xF7 annual return %",ex:"At 9% a year: 72 \xF7 9 = 8 years to double.",w:"It's the fastest sanity check there is. If someone promises doubling in 2 years, they are implying 36% a year \u2014 ask hard questions."},drawdown:{t:"Drawdown",d:"The fall from a peak to the bottom, expressed as a percentage.",ex:"A portfolio falling from CHF 100,000 to CHF 60,000 has a 40% drawdown.",w:"Losses are asymmetric: recovering from \u221250% requires +100%. Avoiding disaster matters more than catching every gain."},volatility:{t:"Volatility",d:"How much a price jumps around, up and down.",w:"Volatility is not the same as risk. A jumpy share in a debt-free company is far safer than a calm one loaded with borrowings. Marks: risk is losing money permanently, not seeing red numbers temporarily."},risk:{t:"Risk",d:"In value investing, the chance of permanently losing your capital \u2014 not the chance of a temporary price fall.",w:"Risk is highest exactly when it feels lowest: after years of gains, when everyone has been rewarded for taking more of it."},diversification:{t:"Diversification",d:"Spreading money across different investments so that one bad outcome can't destroy you.",w:"The cheapest protection available against your own mistakes. The cost is that you'll never own only the best performer."},"asset allocation":{t:"Asset allocation",d:"How you split your money between broad categories: shares, bonds, cash, property.",w:"Bernstein's point: this single decision explains more of your 30-year outcome than which individual shares you pick."},rebalancing:{t:"Rebalancing",d:"Periodically returning your portfolio to its target split by selling what has grown and buying what has fallen.",ex:"Target is 80% shares. After a strong year it's 88%, so you sell 8% and move it to the other side.",w:"It's a mechanical way of selling high and buying low, with the decision made in advance \u2014 before emotion can interfere."},"index fund":{t:"Index fund",d:"A fund that simply owns everything in a market, in proportion, instead of trying to pick winners.",w:"It guarantees you the market's return minus a tiny fee. Most professionals fail to beat it, which makes it the honest benchmark for your own results."},ETF:{t:"ETF (exchange-traded fund)",d:"A fund you buy and sell on the stock exchange exactly like a share. Most index funds you'd buy are ETFs.",w:"Cheap, instantly diversified, and available at every Swiss broker. For most people it's the sensible core of a portfolio."},accumulating:{t:"Accumulating vs distributing fund",d:"An accumulating fund reinvests dividends inside the fund automatically. A distributing fund pays them into your account as cash.",w:"In Switzerland, dividends are taxed as income whether reinvested or not, so accumulating funds don't dodge the tax \u2014 but they do compound automatically without you having to act."},TER:{t:"TER (total expense ratio)",d:"The annual fee a fund charges, as a percentage of your money invested.",ex:"A 0.20% TER on CHF 10,000 costs CHF 20 a year. A 1.5% fee costs CHF 150.",w:"Fees compound against you just as returns compound for you. Over 30 years, 1.5% a year can consume roughly a third of your final capital."},"stamp duty":{t:"Stamp duty (Umsatzabgabe)",d:"A small Swiss tax charged on securities transactions by Swiss brokers \u2014 roughly 0.075% on Swiss and 0.15% on foreign securities.",w:"Small per trade, but it's one more reason frequent trading loses to patience. Verify current rates, as they can change."},"withholding tax":{t:"Withholding tax (Verrechnungssteuer)",d:"Tax deducted at source from dividends before the money reaches you. In Switzerland it's 35% on Swiss dividends.",w:"For Swiss residents it's reclaimable through your tax return, provided you declare the holding. Foreign dividends have their own rates set by treaty."},"S\xE4ule 3a":{t:"S\xE4ule 3a (pillar 3a)",d:"Switzerland's tax-privileged private pension account. Contributions are deducted from your taxable income, and the money is locked until near retirement.",w:"Available to you as an apprentice with earned income. A 3a account invested in shares beats a 3a savings account over long horizons. Check the current annual limit \u2014 it changes."},"capital gains":{t:"Capital gains",d:"The profit made when you sell something for more than you paid.",w:"For private investors in Switzerland these are generally tax-free on securities, while dividends are taxed as income. That asymmetry quietly favours low-yield compounders over high-yield strategies."},"professional securities dealer":{t:"Professional securities dealer status",d:"A Swiss tax classification. If your trading looks like a business rather than private investing, the authorities can reclassify you \u2014 and your capital gains become taxable.",w:"Factors include how long you hold, how often you trade, whether you use borrowed money, and how much of your income it represents. Another argument for patience. Get proper advice before trading heavily."},cyclical:{t:"Cyclical",d:"A company whose profits rise and fall with the wider economy \u2014 carmakers, banks, steel, airlines, chemicals.",w:"The rules invert here: a low P/E usually means profits are at a peak and about to fall, while a scary-looking high P/E can mark the bottom. Misreading this is a common expensive mistake."},stalwart:{t:"Stalwart",d:"Lynch's term for a large, stable company growing perhaps 4\u201312% a year \u2014 think Nestl\xE9 or Coca-Cola.",w:"Expect solid gains over years plus dividends, not spectacular ones. These cushion a portfolio during declines."},"fast grower":{t:"Fast grower",d:"A smaller, aggressive company growing 20%+ a year.",w:"This is where Lynch found his tenbaggers, and also where the biggest losses happen. Size these positions so a failure doesn't hurt too much."},turnaround:{t:"Turnaround",d:"A damaged company that might recover \u2014 if something actually changes.",w:"Hope is not a catalyst. You need new management, a sold-off division, a fixed balance sheet \u2014 something concrete."},"asset play":{t:"Asset play",d:"A company sitting on something worth more than its share price suggests \u2014 land, a stake in another business, cash.",w:"Only works if that hidden value can actually be sold or unlocked. Otherwise it stays hidden forever."},"value trap":{t:"Value trap",d:"A share that looks cheap on the numbers but keeps falling, because the underlying business is genuinely dying.",ex:"Newspapers, video rental shops and mall retailers were all statistically cheap the entire way down to zero.",w:"The multiple falls as fast as the profits, so the discount never closes. The test is whether profits have stopped deteriorating \u2014 not whether the P/E is low."},tenbagger:{t:"Tenbagger",d:"Lynch's word for an investment that grows to ten times what you paid.",w:"A share can only fall 100% but can rise 1,000%. That asymmetry means a few big winners can carry many losers \u2014 provided you let winners run."},diworsification:{t:"Diworsification",d:"Lynch's term for a company buying unrelated businesses with shareholders' money instead of returning it.",ex:"A profitable software company buying a chain of gyms.",w:"It usually signals management has run out of good ideas in its core business and would rather build an empire than pay you."},"second-level thinking":{t:"Second-level thinking",d:"Marks's idea: don't just ask whether it's a good company, ask whether the price already assumes it's a good company.",ex:"First level: 'great business, buy it.' Second level: 'great business, but priced for perfection, so the likely return is poor.'",w:"You can't do what everyone else does and expect a different result. The edge lies in the gap between what people believe and what's true."},"Mr. Market":{t:"Mr. Market",d:"Graham's parable: imagine a moody business partner who turns up daily offering to buy your stake or sell you his \u2014 euphoric some days, terrified on others.",w:"He is there to serve you, not to instruct you. A falling price is his mood changing, which is only your problem if you choose to accept his offer."},"Graham number":{t:"Graham number",d:"A maximum price for cautious investors, combining Graham's two limits \u2014 never pay more than 15\xD7 annual profit, never more than 1.5\xD7 book value \u2014 into one number. The 22.5 in the formula is simply 15 \xD7 1.5.",f:"Graham number = \u221A(22.5 \xD7 EPS \xD7 book value per share)",ex:"EPS CHF 3, book value per share CHF 20 \u2192 22.5 \xD7 3 \xD7 20 = 1350 \u2192 \u221A1350 \u2248 CHF 36.74. At that price the P/E is 12.2 and the P/B is 1.84: cheap earnings paying for dear assets, which is the trade-off the formula allows.",w:"Letting one limit be breached when the other is low avoids rejecting good companies on a technicality. Useful for banks, industrials and property; useless for software and brands, whose real value never appears in book value."},"market cap":{t:"Market capitalisation",d:"The total price of the whole company: what you'd pay to buy every share.",f:"Market cap = share price \xD7 number of shares",ex:"10m shares at CHF 50 \u2192 CHF 500m.",w:"The share price alone is meaningless without this. A CHF 5 share isn't 'cheaper' than a CHF 500 share \u2014 it just has more shares outstanding."},buyback:{t:"Share buyback",d:"The company uses its cash to buy its own shares and cancel them, so each remaining share owns a bigger slice.",w:"Excellent when done at low prices, value-destroying when done at high ones. Most companies buy back most heavily at the top."},"position sizing":{t:"Position sizing",d:"Deciding how much money goes into a single investment.",w:"Size by conviction and by survivability. If a 60% fall in one holding would end your plan, that holding is too big \u2014 no matter how confident you feel."},benchmark:{t:"Benchmark",d:"The standard you measure yourself against \u2014 usually a global index fund.",w:"Without one, you can't tell skill from a rising tide. If you can't beat it over many years, the honest answer is to own more of it."},"pre-money":{t:"Pre-money / post-money valuation",d:"A startup's agreed value before new money goes in (pre) and after (post).",f:"Post-money = pre-money + amount raised",ex:"CHF 4m pre-money plus a CHF 1m raise \u2192 CHF 5m post-money. Your CHF 50,000 buys 1% of the post-money figure.",w:"Always check which one is being quoted. Confusing them can silently halve your stake."},dilution:{t:"Dilution",d:"Your ownership percentage shrinking when the company issues new shares in later funding rounds.",f:"New % = old % \xD7 (1 \u2212 share of new shares issued)",ex:"You own 10%. The company issues shares equal to 20% of the company \u2192 you now own 8%.",w:"It happens at every round. That's fine if the value of each remaining point rises more than your percentage falls."},SAFE:{t:"SAFE / convertible note",d:"A way of investing early without agreeing a valuation yet: your money converts into shares at the next proper funding round.",w:"Two terms decide everything \u2014 the valuation cap and the discount. Without a cap, you can fund a company early and receive almost nothing if it later raises at a huge valuation."},"valuation cap":{t:"Valuation cap",d:"The maximum valuation at which your early investment converts into shares, no matter how high the next round prices.",ex:"You invest with a CHF 5m cap. The next round happens at CHF 20m \u2014 you still convert as if the company were worth CHF 5m, so you get four times more shares.",w:"It's the single most important term for an early investor. Without it, your reward for taking the earliest risk gets competed away."},"pro-rata":{t:"Pro-rata rights",d:"The right to invest more in later rounds to keep your ownership percentage from shrinking.",w:"Only worth exercising if the company has genuinely improved. Following your money into a deteriorating business is how angels turn small losses into large ones."},"cap table":{t:"Cap table",d:"The list of who owns what percentage of a company.",w:"A messy one \u2014 big stakes held by people no longer involved \u2014 puts off future investors and can quietly kill a promising company."},ARR:{t:"ARR / MRR",d:"Annual and monthly recurring revenue: the predictable subscription income a company collects.",f:"ARR = MRR \xD7 12",ex:"CHF 30,000 a month \u2192 CHF 360,000 ARR.",w:"For software startups it's the main measure of real traction \u2014 but only if customers keep renewing. Check churn alongside it."},churn:{t:"Churn",d:"The percentage of customers who leave in a given period.",ex:"8% monthly churn means that after a year, most of the customers you started with are gone.",w:"High churn means growth is a leaking bucket: the company must keep buying new customers just to stand still."},"burn rate":{t:"Burn rate & runway",d:"Burn rate is how much cash a startup loses each month. Runway is how many months remain before it runs out.",f:"Runway = cash in bank \xF7 monthly burn",ex:"CHF 600,000 in the bank, burning CHF 50,000 a month \u2192 12 months of runway.",w:"Under six months and the founders are raising money from a position of weakness, which usually means bad terms for everyone."},"power law":{t:"Power law",d:"The pattern of startup returns: most investments return nothing, and one or two produce almost all the gains.",ex:"In twenty angel investments, ten may go to zero, seven return little, and one might return 30\xD7, paying for everything else.",w:"It's why angels make many small investments rather than a few large ones. With only five, you can easily catch none of the winners."},"unit economics":{t:"Unit economics",d:"Whether a single sale or single customer actually makes money once all the direct costs are counted.",ex:"A delivery marketplace taking CHF 4 per order but paying CHF 6 to the driver loses money on every order \u2014 growth makes it worse, not better.",w:"Companies with broken unit economics can look impressive while quietly destroying cash."},GMV:{t:"GMV & take rate",d:"GMV is the total value of goods sold through a marketplace. The take rate is the percentage the marketplace keeps.",ex:"CHF 10m of GMV at a 4% take rate \u2192 CHF 400,000 of actual revenue.",w:"Founders quote GMV because it's the bigger number. Only the take rate reaches the company."},liquidity:{t:"Liquidity / illiquidity",d:"How easily you can turn an investment back into cash.",w:"Shares are liquid \u2014 sold in seconds. Startup stakes are not: expect 7\u201312 years with no way out. Never invest money there that you might need."},"dry powder":{t:"Dry powder",d:"Cash held deliberately in reserve, ready to invest when opportunities appear.",w:"It looks lazy during a rising market and becomes the most valuable thing you own during a crash."},REIT:{t:"REIT",d:"A listed company that owns rental property and is required to pay out most of its income as dividends.",w:"Judge it on cash flow per share rather than reported profit, since property depreciation distorts accounting profits badly. Sensitive to interest rates."},"shares outstanding":{t:"Shares outstanding",d:"The total number of shares that exist.",w:"Watch it over time. If it keeps rising, your slice is being quietly diluted \u2014 often to pay staff in shares."},revenue:{t:"Revenue",d:"The total money coming in from sales, before any costs are deducted. Also called turnover or the top line.",w:"Revenue is vanity, profit is sanity, cash is reality. Plenty of high-revenue companies have never earned a franc."}},tB={"earnings per share":"EPS","P/E ratio":"P/E","price to earnings":"P/E","PEG ratio":"PEG","price to book":"P/B","return on equity":"ROE",moats:"moat","discounted cash flow":"DCF","cost of capital":"WACC","free cash flow":"free cash flow","capital expenditure":"capex","growth capex":"capex",depreciation:"D&A",amortisation:"D&A","depreciation & amortisation":"D&A","net profit":"net income",borrowings:"net debt","debt/EBITDA":"net debt","margin debt":"leverage",levered:"leverage","debt/EBITDA":"net debt/EBITDA","leverage ratio":"net debt/EBITDA","net debt to EBITDA":"net debt/EBITDA","borrowed money":"leverage",dividends:"dividend",yield:"dividend yield",compound:"compounding",compounds:"compounding",drawdowns:"drawdown",volatile:"volatility",diversified:"diversification",diversification:"diversification",allocation:"asset allocation",rebalance:"rebalancing","index funds":"index fund",ETFs:"ETF","expense ratio":"TER",Umsatzabgabe:"stamp duty",Verrechnungssteuer:"withholding tax","pillar 3a":"S\xE4ule 3a","capital gain":"capital gains","professional securities dealer":"professional securities dealer",cyclicals:"cyclical",stalwarts:"stalwart","fast growers":"fast grower",turnarounds:"turnaround","asset plays":"asset play","value traps":"value trap",tenbaggers:"tenbagger","market capitalisation":"market cap","market capitalization":"market cap",buybacks:"buyback","share buyback":"buyback","post-money":"pre-money","pre-money valuation":"pre-money","post-money valuation":"pre-money",dilute:"dilution",diluted:"dilution","convertible note":"SAFE",SAFEs:"SAFE","pro-rata rights":"pro-rata",MRR:"ARR","recurring revenue":"ARR",runway:"burn rate","take rate":"GMV",illiquid:"liquidity",illiquidity:"liquidity",REITs:"REIT",payout:"payout ratio",intrinsic:"intrinsic value","discount to intrinsic value":"discount to value","fair value":"intrinsic value","second level":"second-level thinking"};var M={bg:"#0A1017",surface:"#121A24",surface2:"#18222E",line:"#22303D",text:"#E8E5DE",dim:"#8A97A6",brass:"#D6A64A",gain:"#3FA97A",loss:"#D06A5A",cool:"#5B8DB8"},Jr="Georgia, 'Iowan Old Style', 'Times New Roman', serif",xa="ui-monospace, 'SF Mono', Menlo, Consolas, monospace",J0=[{id:1,name:"Money & Behaviour",source:"Housel \xB7 Stanley & Danko",color:M.brass},{id:2,name:"Mr. Market",source:"Graham \u2014 The Intelligent Investor",color:M.cool},{id:3,name:"Know What You Own",source:"Lynch \u2014 One Up on Wall Street",color:M.gain},{id:4,name:"Moats",source:"Buffettology \u2014 Buffett & Clark",color:M.brass},{id:5,name:"Valuation",source:"Pignataro \xB7 Sander & Haley \xB7 Little Book",color:M.cool},{id:6,name:"Risk & Cycles",source:"Marks \u2014 The Most Important Thing",color:M.loss},{id:7,name:"Portfolio Architecture",source:"Bernstein \u2014 Four Pillars",color:M.gain},{id:8,name:"Passive Income",source:"Dividends, ETFs, Swiss tax reality",color:M.brass},{id:9,name:"Startup / Angel",source:"Power law, dilution, SAFEs",color:M.cool},{id:10,name:"Conviction",source:"Estebaranz \u2014 The Art of Investing",color:M.gain}],Po=[{id:"1a",unit:1,title:"Behaviour beats IQ",cards:[{h:"Investing is not a maths exam",p:"Housel\u2019s core claim: financial outcomes are driven by how you behave under stress, not by what you know. A person with average knowledge and iron discipline destroys a genius who panics. Every strategy in this app dies the moment you abandon it at the bottom."},{h:"Luck and risk are siblings",p:"Every visible outcome contains both. That means you cannot judge a decision by its result \u2014 you judge it by the process that produced it. Copying someone because they got rich is how you inherit their risk without their luck."},{h:"Getting rich \u2260 staying rich",p:"Getting wealthy takes optimism and risk. Staying wealthy takes paranoia, low burn and survival. Only survival compounds: a portfolio that returns 20%, 20%, then \u221260% has lost money. Nothing beats being able to stay in the game."},{h:"The rule of 72",p:"Divide 72 by your annual return and you get the number of years your money takes to double. At 9% a year: 72 \xF7 9 = 8 years. At 6%: twelve years. At 3%: twenty-four. You can do it in your head, which is the entire point \u2014 it turns a vague promise into a number you can check."},{h:"Doubling is what does the work",p:"The rule matters because doubling repeats on the same clock. CHF 5,000 at 7% doubles roughly every 10 years: 10,000 at 28, 20,000 at 38, 40,000 at 48, 80,000 at 58. Notice the last doubling adds CHF 40,000 \u2014 more than the first four combined. This is why the years you invest early are worth more than the amounts you invest later, and why the most expensive decision is waiting."},{h:"Running it backwards",p:"Flip it and it becomes a lie detector. Someone promising to double your money in two years is claiming 36% a year (72 \xF7 2), roughly triple what the best investors alive sustain \u2014 so either the risk is enormous or the claim is false. It also prices fees: a 1.5% annual fee turns a 7% return into 5.5%, stretching each doubling from 10 years to 13. Over a lifetime that is one entire doubling lost. Treat it as an estimate; it is most accurate between about 5% and 15%."}],quiz:[{type:"mc",q:"A friend put 90% of his savings into one coin and tripled it in six months. What is the correct conclusion?",options:["He found an edge \u2014 ask him what to buy next","The outcome is loud but proves nothing about the decision quality","Concentration always beats diversification","He is a better investor than you"],a:1,why:"Judge process, not outcome. A high-variance bet that paid once tells you almost nothing about expected value. This is Housel\u2019s luck/risk pair and Marks\u2019 point that you must evaluate the decision as it looked before the result was known."},{type:"tf",q:"A 25% average annual return with one \u221270% year beats a steady 12% over 20 years.",a:!1,why:"Compounding is multiplicative. One catastrophic year permanently removes the base that everything after it compounds on. Survival > peak return."},{type:"num",q:"Rule of 72: at a 9% annual return, roughly how many years to double your money?",a:8,tol:.6,unit:"years",why:"72 \xF7 9 = 8 years. The rule of 72 is your fastest mental check on whether a return assumption is realistic."}]},{id:"1b",unit:1,title:"Wealth is what you don\u2019t see",cards:[{h:"The PAW formula",p:"Stanley & Danko: expected net worth \u2248 age \xD7 annual pre-tax income \xF7 10. Hit double that and you are a Prodigious Accumulator of Wealth (PAW). Half or less makes you an Under Accumulator (UAW) \u2014 regardless of how big your salary is."},{h:"Income is not wealth",p:"Wealth is the income you did not spend. A visible lifestyle is evidence of spending, not of assets. \u201CBig hat, no cattle\u201D is the single most expensive mistake young high earners make."},{h:"The one variable you control",p:"You cannot control returns. You can control your savings rate, your costs and your time horizon. At 18, time horizon is the largest asset on your balance sheet and it is non-renewable."}],quiz:[{type:"num",q:"You are 34 and earn CHF 90,000 pre-tax. What is the expected net worth benchmark (in CHF)?",a:306e3,tol:3e3,unit:"CHF",why:"34 \xD7 90,000 \xF7 10 = CHF 306,000. Doubling that (CHF 612,000) would classify you as a PAW."},{type:"mc",q:"Two neighbours: A earns 200k and has 80k net worth. B earns 70k and has 400k. Who is the better investor?",options:["A \u2014 higher earning power","B \u2014 converts income into assets","Impossible to say","Neither, both are below benchmark"],a:1,why:"B has a far higher conversion rate of income into capital. Stanley\u2019s research found most millionaires were in unglamorous businesses with high defence (saving) rather than record offence (earning)."},{type:"tf",q:"Raising your savings rate from 10% to 20% roughly halves the time to financial independence.",a:!0,why:"It works from both ends: you accumulate faster AND you need a smaller pot because your annual spending is lower. Savings rate is the single most powerful lever before your capital gets large."}]},{id:"2a",unit:2,title:"Mr. Market",cards:[{h:"Graham\u2019s parable (Ch. 8)",p:"Imagine a manic business partner who shows up every day quoting a price to buy your share or sell you his. Some days he is euphoric, some days terrified. He is there to serve you, not to instruct you. You are free to ignore him entirely."},{h:"Price is what you pay",p:"A falling price is new information about sentiment, not automatically about the business. The only question that matters: has the earning power of the business changed, or only the mood of the crowd?"},{h:"Discount to value: the calculation",p:"Once you have an estimate of what a business is worth, you need one number to describe how good today's price is. That number is the discount to value: subtract the price from your value estimate, then divide by your value estimate. You think it is worth CHF 100 and it trades at CHF 62 \u2192 (100 \u2212 62) \xF7 100 = 0.38, a 38% discount. Always divide by the value, never by the price \u2014 dividing by price answers a different question."},{h:"What the discount is actually for",p:"It is your error budget, not your profit forecast. A 38% discount means your valuation could turn out to be 38% too optimistic and you would still not have overpaid. Graham wanted at least a third off for exactly this reason. It also puts every opportunity on one scale: a bank at a 40% discount and a software firm at 10% become directly comparable, no matter how different the businesses are."},{h:"The asymmetry hidden inside it",p:"Discount and upside are not the same number. Buying at CHF 62 something worth CHF 100 is a 38% discount but a 61% gain if the price ever reaches value (100 \xF7 62 \u2212 1). The deeper the discount, the more violently the two diverge: a 50% discount is a 100% gain, a 75% discount is a 300% gain. This is the whole mechanical argument for waiting \u2014 patience does not improve the business, it improves the arithmetic. And the size of the discount you demand should rise with how uncertain your estimate is: a stable Swiss utility might justify buying at 20% off, a cyclical whose profits swing wildly might need 50%."},{h:"Defensive vs enterprising",p:"Graham splits investors by effort, not by risk appetite. The defensive investor buys broad index funds and rebalances. The enterprising investor does the work \u2014 statements, competitors, valuation. Choose honestly: the worst outcome is enterprising ambition with defensive effort."}],quiz:[{type:"mc",q:"A company you own drops 30% in a week. No news about the business. Correct first action?",options:["Sell \u2014 the market knows something","Re-run your valuation; if unchanged, consider buying more","Average down immediately without checking","Set a stop-loss at \u221235%"],a:1,why:"Mr. Market offering a lower price is an option, not a verdict. But re-checking your thesis first is mandatory \u2014 automatically averaging down is how value traps eat you (Unit 5)."},{type:"num",q:"You estimate intrinsic value at CHF 100. The market price is CHF 62. What discount to value are you buying at (%)?",a:38,tol:1,unit:"%",why:"(100 \u2212 62) \xF7 100 = 38%. Graham wanted a large gap precisely because your estimate of 100 might be wrong."},{type:"tf",q:"Volatility and risk are the same thing.",a:!1,why:"Marks and Graham both reject this. Volatility is price movement; risk is the permanent loss of capital. A stable stock with a levered balance sheet is often riskier than a jumpy one with net cash."}]},{id:"2b",unit:2,title:"Margin of safety",cards:[{h:"The three words (Ch. 20)",p:"Graham reduced sound investing to \u201Cmargin of safety\u201D: buy so far below your estimate of value that being wrong still leaves you whole. It is not a prediction tool \u2014 it is an admission that your forecast will be wrong."},{h:"Where safety comes from",p:"Three sources: a low price relative to value, a business whose earning power is durable, and diversification so that a single error is not fatal. Stack them; never rely on one."},{h:"How much debt is too much",p:"The standard measure is net debt \xF7 EBITDA \u2014 roughly, how many years of operating profit it would take to repay everything the company owes. Under 2\xD7 is comfortable. Around 3\xD7 is stretched. Above 4\xD7, the lenders effectively set the strategy, not the management. A company at 4\xD7 with falling sales is in the worst possible position: as profits shrink the ratio worsens on its own, and when the loan comes up for renewal the bank can demand repayment, a share issue that dilutes you, or asset sales at terrible prices."},{h:"Why debt destroys safety",p:"Your one structural advantage as a private investor is that nobody can force you to act \u2014 you can hold for a decade while the market changes its mind. Debt removes exactly that advantage from the company you own. A cheap, unlevered business can sit out a bad five years; a cheap, heavily indebted one can be wiped out during them, with the shares going to zero while the assets go to the lenders. This is why a low P/E means nothing until you have checked the balance sheet."},{h:"Graham's two ceilings",p:"For cautious investors Graham set two separate price limits. Never pay more than 15 times annual profit \u2014 that is a P/E of 15. And never pay more than 1.5 times the company's accounting value \u2014 that is a P/B of 1.5. The first limits what you pay for profits, the second limits what you pay for assets."},{h:"Where the 22.5 comes from",p:"Applying both limits rigidly is too strict: a company with unusually cheap assets but a slightly high P/E would be rejected for no good reason. So Graham let one ceiling be breached if the other is low enough to compensate. He simply multiplied them: 15 \xD7 1.5 = 22.5. That single number is the entire origin of the formula \u2014 nothing mystical, just his two rules combined into one. This is what 'the combined earnings and assets limit' means."},{h:"The Graham number",p:"The formula turns that combined ceiling into a maximum price per share: \u221A(22.5 \xD7 EPS \xD7 book value per share). Take EPS of CHF 3 and book value per share of CHF 20 \u2192 22.5 \xD7 3 \xD7 20 = 1350, and \u221A1350 \u2248 CHF 36.74. That is the most a defensive investor should pay. The square root is there because you multiplied two per-share figures together, so you need to bring the result back down to a single per-share price."},{h:"Reading the result",p:"At CHF 36.74 the P/E is 12.2 (36.74 \xF7 3) and the P/B is 1.84 (36.74 \xF7 20). The P/E sits below the limit of 15 while the P/B sits above 1.5 \u2014 the cheap earnings are paying for the expensive assets, which is exactly the trade Graham allowed. Multiply the two and you get 22.5 again. Pay more than CHF 36.74 and you break the combined ceiling."},{h:"When to ignore it",p:"It is a screening filter, not an analysis. It works on banks, insurers, industrials and property \u2014 businesses whose value genuinely sits on the balance sheet. It is useless for software, brands or anything whose worth is code, patents and people, because those barely appear in book value. Applied to Microsoft it would have told you to never buy at any price for thirty years."}],quiz:[{type:"num",q:"EPS is CHF 3.00 and book value per share is CHF 20. What is the Graham number (CHF)?",a:36.74,tol:1,unit:"CHF",why:"22.5 \xD7 3 \xD7 20 = 1350, and \u221A1350 \u2248 36.74. Remember the 22.5 is just Graham\u2019s two limits multiplied together: 15 times earnings \xD7 1.5 times book value. At CHF 36.74 you would be paying a P/E of 12.2 and a P/B of 1.84 \u2014 cheap on profits, dear on assets, which nets out to exactly his ceiling. Pay more and you breach it."},{type:"mc",q:"Which position has the weakest margin of safety?",options:["Profitable, net cash, bought at 40% below your DCF","Cheap on P/E but 4\xD7 net debt/EBITDA and falling sales","Boring stalwart at fair value with 25 years of dividends","Index fund bought after a 30% market decline"],a:1,why:"Statistical cheapness plus leverage plus deterioration is the classic value trap. Debt removes your ability to wait, which is the whole asset of a long-horizon investor."},{type:"tf",q:"Margin of safety means you have accurately predicted the future.",a:!1,why:"The opposite. It exists because you have not."}]},{id:"3a",unit:3,title:"Lynch\u2019s six categories",cards:[{h:"Classify before you value",p:"Lynch: you cannot judge a result without knowing the game. Slow growers (2\u20134% growth, big dividend), stalwarts (8\u201312%, defensive compounders), fast growers (20%+, where tenbaggers live), cyclicals (earnings swing with the economy), turnarounds (broken but fixable), asset plays (worth more dead than alive)."},{h:"Cyclicals invert the rules",p:"For a cyclical, a low P/E is usually a warning that earnings are at a peak, and a high or negative P/E can mark the bottom. Applying a stalwart\u2019s logic to a cyclical is one of the most common ways private investors lose money."},{h:"Know what you own",p:"The two-minute drill: if you cannot explain in two minutes why you own it \u2014 what the company sells, why it wins, what has to go right \u2014 you do not own an investment, you own a ticker."}],quiz:[{type:"mc",q:"A steel producer trades at a P/E of 4 after two record years. Most likely reading?",options:["Deep value \u2014 buy aggressively","Peak-cycle earnings; the low P/E is a warning","A fast grower being ignored","An asset play"],a:1,why:"Classic Lynch cyclical. The E in P/E is inflated by the cycle top. You want cyclicals when the P/E looks terrible and capacity is being shut down."},{type:"mc",q:"Nestl\xE9-type business: 4\u20136% growth, huge brand portfolio, reliable dividend. Category?",options:["Fast grower","Turnaround","Stalwart","Asset play"],a:2,why:"Stalwart. Expect 30\u201350% gains over years plus dividends, not tenbaggers. Lynch sized these to cushion drawdowns, not to drive returns."},{type:"tf",q:"\u201CInvest in what you know\u201D means buying a product you like is sufficient research.",a:!1,why:"Lynch is misquoted constantly. Familiarity generates the idea; the financials decide the investment. He explicitly demanded you check the balance sheet and growth rate afterwards."}]},{id:"3b",unit:3,title:"PEG, tenbaggers, diworsification",cards:[{h:"PEG in one line",p:"P/E divided by the earnings growth rate. Below 1 is interesting, around 0.5 is very attractive, above 2 you are paying for growth that must actually arrive. Lynch used it to compare businesses that are otherwise not comparable."},{h:"Tails drive the portfolio",p:"Lynch\u2019s record came from a small number of tenbaggers that paid for many losers. Because a stock can only fall 100% but rise 1,000%, you can be wrong more than half the time and still win \u2014 if you let winners run and size losers small."},{h:"Diworsification",p:"Watch for companies buying unrelated businesses with shareholder cash. It usually signals that management has run out of high-return ideas in its core and would rather build an empire than return capital."}],quiz:[{type:"num",q:"P/E is 18 and sustainable earnings growth is 24%. What is the PEG?",a:.75,tol:.05,why:"18 \xF7 24 = 0.75. Below 1 means you are paying less than a point of P/E per point of growth."},{type:"mc",q:"Your position is up 240% and now looks expensive on P/E, but growth is accelerating and the runway is long. Lynch\u2019s instinct?",options:["Sell \u2014 never let a gain turn into a loss","Trim to the original size mechanically","Hold while the story is intact; selling winners early caps your tails","Double down with leverage"],a:2,why:"\u201CPulling the flowers and watering the weeds.\u201D The sell decision is driven by the story breaking, not by the price having gone up."},{type:"tf",q:"A software company acquiring a chain of restaurants is a positive signal about capital allocation.",a:!1,why:"Textbook diworsification."}]},{id:"4a",unit:4,title:"Consumer monopoly vs commodity",cards:[{h:"The two business types",p:"Buffett & Clark split the world in two. Commodity businesses sell an undifferentiated product, compete on price, and earn low returns forever. Consumer monopolies own something in the customer\u2019s head or in the infrastructure \u2014 a brand, a habit, a network, a switching cost \u2014 and can raise prices without losing volume."},{h:"The pricing power test",p:"Ask one question: if this company raised prices 10% tomorrow, what happens? If volumes collapse, it is a commodity. If customers grumble and pay, you have found a moat \u2014 and inflation becomes an ally rather than an enemy."},{h:"ROE consistency",p:"Buffettology screens for return on equity consistently above ~15% without heavy debt, over 10 years. Consistency matters more than the peak: a single good year is noise, a decade is evidence of structure."}],quiz:[{type:"mc",q:"Which is most likely a consumer monopoly?",options:["An airline on the Zurich\u2013London route","A payment network taking a fee on every card swipe","A generic paper mill","A regional construction contractor"],a:1,why:"A payment network has a two-sided network effect: more cards attract more merchants, which attract more cards. Airlines, mills and contractors compete on price and capacity."},{type:"mc",q:"Company A: ROE 22% every year for 10 years, low debt. Company B: ROE 30% but debt/equity of 3. Which is the stronger business?",options:["B \u2014 higher ROE","A \u2014 the return is not manufactured by leverage","Identical","B, if interest rates stay low"],a:1,why:"Leverage inflates ROE while adding fragility. Buffett strips out debt-driven returns because debt destroys your ability to survive a bad decade."},{type:"tf",q:"A strong brand alone guarantees a moat.",a:!1,why:"The brand must translate into pricing power or repeat purchase. Plenty of famous brands earn commodity returns."}]},{id:"4b",unit:4,title:"Equity bonds & the retained earnings test",cards:[{h:"Stocks as equity bonds",p:"Buffett reframes a share as a bond whose coupon is EPS and whose face value is book value \u2014 except the coupon grows. If you pay CHF 60 for EPS of CHF 4, your initial \u201Ccoupon yield\u201D is 6.7%, and the question becomes how fast that coupon grows."},{h:"The one-dollar test",p:"For every franc of earnings retained rather than paid out, has the company created at least one franc of market value over time? If not, management is destroying capital and the dividend should be higher."},{h:"Projecting a return",p:"Grow today\u2019s EPS at a conservative rate for 10 years, apply a conservative exit multiple, add dividends, then compute the annual return from today\u2019s price. If that number is not clearly above what an index gives you, do nothing."}],quiz:[{type:"num",q:"EPS is CHF 5, growing 12% for 10 years. What is EPS in year 10 (CHF)?",a:15.53,tol:.6,unit:"CHF",why:"5 \xD7 1.12^10 \u2248 15.53. This is the whole engine of long-horizon investing: the multiple is noise, the earnings path is signal."},{type:"num",q:"That year-10 EPS of 15.53 at an exit P/E of 15 gives ~CHF 233. You pay CHF 60 today. What is the approximate annual return (%)?",a:14.5,tol:1.5,unit:"%",why:"(233 \xF7 60)^(1/10) \u2212 1 \u2248 14.5% per year before dividends. Now compare it against a global index at ~7% \u2014 this is how you decide whether the work was worth it."},{type:"tf",q:"A company retaining all earnings while its market value stagnates for a decade passes the one-dollar test.",a:!1,why:"It fails. That capital would have been worth more in your hands."}]},{id:"5a",unit:5,title:"What a business is actually worth",cards:[{h:"Four lenses",p:"Asset value (what the balance sheet is worth), earnings power value (current profits capitalised, assuming zero growth), growth value (only real when returns exceed the cost of capital), and comparables (what the market pays for similar businesses). Value investors weight the first two heavily because they require the fewest assumptions."},{h:"P/E is a shortcut, not a value",p:"A P/E is the answer to a DCF you did not do. It bundles growth, risk, capital intensity and accounting policy into one number. Use it to compare, never to conclude."},{h:"Quality of earnings",p:"Profit is an opinion, cash is a fact. Check whether net income converts into operating cash flow. If receivables and inventories consistently grow faster than sales, the earnings are being manufactured on paper."}],quiz:[{type:"mc",q:"Two companies both earn CHF 100m. A needs CHF 90m of capex to stand still, B needs CHF 15m. Which is worth more?",options:["Equal \u2014 same earnings","A \u2014 heavier assets","B \u2014 far more of the profit is actually distributable","Cannot say without the P/E"],a:2,why:"Owner earnings, not net income, is what you can take out. Capital intensity is the difference between a compounder and a treadmill."},{type:"tf",q:"Sales growing 8% while receivables grow 40% is a normal, healthy pattern.",a:!1,why:"It usually means revenue is being recognised on sales that have not been collected \u2014 a classic earnings-quality red flag."},{type:"mc",q:"Which valuation input do you have the least ability to forecast?",options:["Current book value","Trailing free cash flow","The terminal multiple in 10 years","This year\u2019s dividend"],a:2,why:"The terminal value usually drives 60\u201380% of a DCF and is the least knowable input. Pignataro\u2019s modelling discipline is precisely about knowing which assumptions carry the answer."}]},{id:"5b",unit:5,title:"Owner earnings & DCF mechanics",cards:[{h:"Owner earnings",p:"Net income + depreciation & amortisation \u2212 maintenance capex \xB1 working capital change. Buffett\u2019s definition of what the owner can actually pull out of the business each year without shrinking it."},{h:"The DCF in one sentence",p:"Project free cash flow for 5\u201310 years, discount each year back at your required return (or WACC), add a terminal value, subtract net debt, divide by shares. Everything else is decoration."},{h:"The discount rate is your hurdle",p:"In practice most private investors skip WACC and use a required return: \u201CI want 10% a year, what can I pay?\u201D That inverts the model into a decision tool instead of a false precision machine."}],quiz:[{type:"num",q:"Net income 120, D&A 40, maintenance capex 55, working capital increase 10. Owner earnings?",a:95,tol:1,why:"120 + 40 \u2212 55 \u2212 10 = 95. Growth capex is excluded; only what is needed to stand still is subtracted."},{type:"num",q:"A business will produce CHF 10m of cash flow forever with no growth. You require a 10% return. Maximum price?",a:100,tol:2,unit:"m CHF",why:"Perpetuity value = cash flow \xF7 discount rate = 10 \xF7 0.10 = CHF 100m. Everything above that is you accepting a lower return."},{type:"tf",q:"A DCF with 20 years of detailed projections is more reliable than one with 5 years plus a conservative terminal value.",a:!1,why:"Longer projections add precision, not accuracy. The extra years mostly encode your optimism."}]},{id:"5c",unit:5,title:"Cheap vs value trap",cards:[{h:"The trap",p:"A low multiple on declining earnings is not cheap \u2014 it is expensive in slow motion. The multiple falls as fast as the earnings do, so the price never rises. Newspapers, video rental, mall retail: all were statistically cheap the whole way down."},{h:"What separates value from trap",p:"Three things: a balance sheet strong enough to wait, earnings that stabilise rather than erode, and something that changes \u2014 a catalyst, new management, a divestment, a buyback at a low price."},{h:"Quality at a fair price",p:"The Little Book approach still works (low P/B, low P/E, insider buying, dividends), but modern practice adds a durability filter. Buffett\u2019s shift: better to buy a wonderful business at a fair price than a fair business at a wonderful price."}],quiz:[{type:"mc",q:"Which single fact most reliably distinguishes value from value trap?",options:["Low P/E","High dividend yield","Stabilising or growing owner earnings","A famous investor owns it"],a:2,why:"Everything else is a snapshot. Whether cash generation has stopped deteriorating tells you if the discount can ever close."},{type:"tf",q:"Insiders buying shares with their own money is a meaningful positive signal.",a:!0,why:"Insiders sell for many reasons but buy for essentially one. It is one of the few signals with persistent statistical support."},{type:"mc",q:"A retailer trades at 0.4\xD7 book. Book is mostly ageing stores on long leases and slow-moving inventory. Real margin of safety?",options:["Yes \u2014 60% below book","No \u2014 the book value is unlikely to be realisable","Yes if the dividend holds","Only if it is a turnaround"],a:1,why:"Asset value only protects you if the assets can be sold at carrying value. Leases are liabilities, and stale inventory is worth far less than stated."}]},{id:"6a",unit:6,title:"Second-level thinking",cards:[{h:"First vs second level",p:"First level: \u201CIt\u2019s a good company, buy it.\u201D Second level: \u201CIt\u2019s a good company, but everyone knows that and the price already assumes perfection, so the expected return is poor.\u201D Marks: you cannot do the same thing as everyone else and expect a different result."},{h:"You must be non-consensus AND right",p:"Being contrarian alone is just being wrong in an unusual direction. The edge comes from holding a view that differs from the crowd for a reason the crowd is ignoring, and being correct about it."},{h:"Price already contains the story",p:"Good news is not the same as good investment. The question is never \u201Cis this a great business?\u201D but \u201Cis it great relative to what the price demands?\u201D"}],quiz:[{type:"mc",q:"Everyone agrees a company will grow 30% a year for a decade, and it trades at 70\xD7 earnings. Second-level view?",options:["Buy \u2014 consensus confirms quality","The consensus is in the price; the return depends on beating it","Short it \u2014 high multiples always fall","Ignore, wait for a crash"],a:1,why:"At 70\xD7 you are not paid for the expected case, only for the case that exceeds expectations. Marks: superior results come from a gap between perception and reality."},{type:"tf",q:"Buying what everybody hates is automatically second-level thinking.",a:!1,why:"Contrarianism without an analytical reason is a coin flip with worse odds."},{type:"mc",q:"Which of these is a genuine second-level question?",options:["Will earnings grow?","Is the chart breaking out?","What is priced in, and what would have to be true for me to be wrong?","What is the analyst target price?"],a:2,why:"Inverting the thesis is the core discipline: state explicitly what would falsify you, before you buy."}]},{id:"6b",unit:6,title:"Risk, cycles and the pendulum",cards:[{h:"Risk is permanent loss",p:"Not volatility, not tracking error. Risk is the probability that capital does not come back. It is highest exactly when it feels lowest \u2014 when prices have risen for years and everyone has been rewarded for taking more risk."},{h:"The pendulum",p:"Markets swing between euphoria and despair, and they spend very little time at the fair midpoint. You cannot time the swing, but you can know where you are on it and adjust aggressiveness accordingly."},{h:"You can\u2019t predict, you can prepare",p:"Preparation means: cash reserve so you are never a forced seller, no leverage that can be called, position sizes that survive a 50% decline, and a written buy list for when prices collapse. Prepared beats prescient."}],quiz:[{type:"mc",q:"When is risk highest?",options:["After a 40% crash when volatility is extreme","After years of gains when nobody sees a threat","When interest rates rise","During earnings season"],a:1,why:"Risk enters the market through price and complacency. After a crash, prices already embed pessimism \u2014 that is when the risk of permanent loss is often lowest."},{type:"tf",q:"Using margin debt is acceptable if your analysis is sound.",a:!1,why:"Leverage converts a temporary price decline into a permanent loss by forcing you to sell at the worst moment. It removes the one advantage a private long-horizon investor has: the ability to wait."},{type:"mc",q:"Markets fall 35%. You hold 12% cash and a written watchlist. Correct move?",options:["Wait for the exact bottom","Deploy in tranches against your pre-written list","Sell to avoid further losses","Switch entirely to bonds"],a:1,why:"Tranching accepts you cannot pick the bottom while guaranteeing you participate. The pre-written list exists because your judgement is worst under stress."}]},{id:"7a",unit:7,title:"Bernstein\u2019s four pillars",cards:[{h:"Theory, history, psychology, business",p:"Bernstein: risk and return are joined at the hip; market history rhymes through manias and panics; your own brain is the main adversary; and the finance industry\u2019s interests are not yours. Skip any pillar and the other three will not save you."},{h:"Allocation dominates selection",p:"The split between equities, bonds, cash and property explains far more of your long-run outcome than which stocks you pick. Decide that first, in writing, and let stock picking be the smaller layer on top."},{h:"History as a risk model",p:"Global markets have delivered roughly 6\u20137% real per year over the long run \u2014 with 50%+ drawdowns along the way. Any plan that has not budgeted for a halving is not a plan."}],quiz:[{type:"mc",q:"Which decision most determines your 30-year outcome?",options:["Which individual stocks you own","Your asset allocation and how consistently you keep it","Your entry timing","Your broker"],a:1,why:"Allocation plus behaviour. Selection matters but sits far below these in explanatory power."},{type:"num",q:"A portfolio drops 50%. What return is needed just to get back to even (%)?",a:100,tol:2,unit:"%",why:"Losses are asymmetric: \u221250% needs +100%. This is why avoiding catastrophe outranks capturing every upside."},{type:"tf",q:"Rebalancing forces you to sell what has risen and buy what has fallen.",a:!0,why:"That is its entire value: a mechanical, unemotional contrarian rule with a pre-agreed trigger."}]},{id:"7b",unit:7,title:"Costs, index core, rebalancing",cards:[{h:"Costs are the only guaranteed return",p:"A 1.5% annual fee compounds against you exactly like a return compounds for you. Over 40 years it can consume a third or more of your final capital. Bernstein\u2019s fourth pillar: the industry is engineered to extract that fee."},{h:"Core and satellite",p:"A practical structure: a low-cost global index core (say 70\u201390%) plus a satellite of individual businesses you have actually researched. The core guarantees you get the market return; the satellite is where your work either pays or teaches you something."},{h:"Swiss specifics",p:"Swiss brokers charge Umsatzabgabe (stamp duty) of roughly 0.075% on domestic and 0.15% on foreign securities; foreign brokers do not. S\xE4ule 3a gives you a tax deduction and is available to you as an apprentice with earned income. Verify current limits before relying on any number."}],quiz:[{type:"num",q:"CHF 100,000 compounding at 7% for 30 years vs 5.5% (after a 1.5% fee). Roughly what percentage of the final value is lost to the fee?",a:35,tol:6,unit:"%",why:"7% \u2192 ~761k; 5.5% \u2192 ~499k. About 34% of the final value goes to fees. This is the strongest argument for a cheap index core."},{type:"mc",q:"Best structure for someone with limited research time and a 30-year horizon?",options:["100% individual stock picks","Global index core with a small researched satellite","Cash until markets fall","Actively managed funds only"],a:1,why:"It guarantees market participation while keeping the upside from your own work \u2014 and it makes your stock-picking record measurable against a real benchmark."},{type:"tf",q:"A fund that beat the market for three years is likely to keep doing so.",a:!1,why:"Short-run outperformance is dominated by luck and factor exposure. Persistence studies find very little skill survives fees."}]},{id:"8a",unit:8,title:"Dividends: the real mechanics",cards:[{h:"Yield is not income",p:"A dividend is a transfer of value out of the share price, not free money. What creates real income is the underlying earnings growing and the payout being sustainable \u2014 otherwise you are being paid with your own capital."},{h:"The payout ratio test",p:"Dividends \xF7 earnings (better: \xF7 free cash flow). Under ~60% is generally sustainable for a stable business. Above 100% means the dividend is funded by debt or asset sales and a cut is coming, usually alongside a price collapse."},{h:"Yield on cost",p:"Buy at CHF 50 with a CHF 1.50 dividend (3%). If the dividend grows 8% a year, in 15 years it is CHF 4.76 \u2014 a 9.5% yield on your original cost. Dividend growth, not starting yield, builds passive income."}],quiz:[{type:"mc",q:"Stock A yields 9%, payout ratio 130%, falling revenue. Stock B yields 2.5%, payout 40%, dividend growing 10%/yr. Better passive income engine over 20 years?",options:["A \u2014 three times the income today","B \u2014 sustainable and compounding","Equal","A, then switch to B"],a:1,why:"A is very likely to cut, taking the price with it. B\u2019s income overtakes it within roughly a decade and keeps going."},{type:"num",q:"You buy at CHF 50 with a CHF 1.50 annual dividend. It grows 8% a year. What is the dividend after 15 years (CHF)?",a:4.76,tol:.3,unit:"CHF",why:"1.50 \xD7 1.08^15 \u2248 4.76, a 9.5% yield on your original cost. This is the mechanism behind long-term dividend income."},{type:"tf",q:"A very high dividend yield is generally a sign of a bargain.",a:!1,why:"It is usually the market pricing in a cut. Yield rises because the price fell for a reason."}]},{id:"8b",unit:8,title:"Building the income stream (Swiss reality)",cards:[{h:"Total return first",p:"Whether income arrives as a dividend or as a sold slice of an appreciated position is mostly a tax and psychology question. Optimise total return, then choose the withdrawal method \u2014 not the reverse."},{h:"Swiss tax structure",p:"For private investors in Switzerland, capital gains on securities are generally tax-free, while dividends and interest are taxed as income. That asymmetry favours accumulating funds and low-yield compounders over high-yield strategies. Trade too actively and you risk being reclassified as a professional securities dealer, which removes the exemption."},{h:"Withholding and fund domicile",p:"Swiss Verrechnungssteuer of 35% is withheld on Swiss dividends and reclaimed via your tax return. Irish-domiciled ETFs (IE ISIN) typically reduce US withholding to 15% versus 30% for many alternatives. Verify current treaty and fund details \u2014 these rules change."}],quiz:[{type:"mc",q:"As a Swiss private investor with a 30-year horizon, which is structurally most tax-efficient?",options:["High-yield dividend portfolio","Accumulating global index fund plus low-yield compounders","Frequent trading of momentum names","Cash savings account"],a:1,why:"Untaxed capital gains plus deferred dividend drag. High yield converts return into taxable income every single year."},{type:"tf",q:"Very frequent trading can cost a Swiss private investor the capital gains exemption.",a:!0,why:"Professional securities dealer classification considers holding period, volume, leverage and how central trading income is to your livelihood. Get advice before trading heavily \u2014 this app is not tax advice."},{type:"num",q:"You need CHF 3,000/month passive income. At a 3.5% sustainable withdrawal rate, what capital is required (CHF)?",a:1028571,tol:3e4,unit:"CHF",why:"36,000 \xF7 0.035 \u2248 CHF 1.03m. Working backwards from the number is the only way to know whether your savings rate is remotely on track."}]},{id:"9a",unit:9,title:"The power law",cards:[{h:"Startup returns are not normal",p:"In a typical angel portfolio, roughly half the investments return zero, a third return something modest, and one or two produce the entire return. The mathematics rewards portfolio construction over deal picking."},{h:"Why 20+ cheques",p:"If one in twenty produces a 30\xD7 outcome, holding five investments gives you a real chance of catching none. Angels who put the same total capital into 25 small cheques outperform those who put it into 5 large ones \u2014 same money, far better hit probability."},{h:"Illiquidity is the price",p:"Expect 7\u201312 years to any exit, no ability to sell, no market price, and dilution along the way. Never invest money you might need. As a founder yourself, remember your own human capital is already fully exposed to this asset class."}],quiz:[{type:"mc",q:"You have CHF 50,000 for angel investing. Best structure?",options:["One CHF 50k cheque into your best idea","Five CHF 10k cheques","Twenty CHF 2.5k cheques across sectors and years","Wait until you can write a CHF 200k cheque"],a:2,why:"Power-law maths: you need enough shots to catch the tail. Spreading across vintages also protects you from investing everything at one point in the funding cycle."},{type:"tf",q:"A startup portfolio where 60% of positions go to zero is a failed portfolio.",a:!1,why:"That is the normal shape of a functioning angel portfolio. What matters is whether one position returned 20\xD7 or more."},{type:"mc",q:"Biggest risk of investing in a friend\u2019s startup?",options:["The valuation","That you cannot assess it objectively and cannot exit the relationship","Legal fees","Dilution"],a:1,why:"Every angel loss is survivable; a destroyed friendship plus a loss is not. If you do it, size it as money you have written off on day one."}]},{id:"9b",unit:9,title:"Dilution, SAFEs and signals",cards:[{h:"Dilution maths",p:"Your percentage falls at every round. Own 10% and the company issues 20% of new shares? You now own 8%. Across four rounds you may end at a third of your starting stake \u2014 which is fine if the value per point rose more than your share fell."},{h:"SAFEs and convertibles",p:"You lend value now and convert to equity at the next priced round. Two terms matter: the valuation cap (the maximum valuation at which you convert) and the discount (typically 15\u201325%). No cap means you can fund a company and receive almost nothing if it raises at a huge valuation."},{h:"Signals worth paying for",p:"Founders with domain scars, real customer revenue rather than letters of intent, a market that already spends money on the problem, tight cap table, and founders who take a low salary. Signals worth ignoring: press coverage, accelerator badges, a slick deck."}],quiz:[{type:"num",q:"You own 10%. The company issues new shares equal to 20% of the post-round cap table. What do you own after (%)?",a:8,tol:.2,unit:"%",why:"10% \xD7 (1 \u2212 0.20) = 8%. Every round applies this multiplicatively."},{type:"mc",q:"You invest CHF 25,000 on a SAFE with a CHF 5m cap and 20% discount. The next round prices at CHF 20m. What happens?",options:["You convert at CHF 20m","You convert at CHF 16m (the discount)","You convert at the CHF 5m cap \u2014 the better term for you","The SAFE expires"],a:2,why:"You get the more favourable of cap and discount. The cap converts your 25k as if the company were worth 5m \u2014 a 4\xD7 better position than converting at the round price."},{type:"tf",q:"A startup with heavy press coverage and no paying customers is a strong signal.",a:!1,why:"Press is a marketing output, not evidence of demand. Revenue from strangers is the only signal that is hard to fake."}]},{id:"10a",unit:10,title:"Conviction, concentration, patience",cards:[{h:"Concentration cuts both ways",p:"Estebaranz argues that meaningful outperformance comes from a concentrated book of deeply researched ideas \u2014 but concentration multiplies the cost of being wrong. The honest rule: concentrate only in proportion to the work you have actually done, and only with money you cannot be forced to sell."},{h:"The three reasons to sell",p:"One: the thesis is broken. Two: the price now exceeds any reasonable value. Three: you found something clearly better and capital is limited. \u201CIt went down\u201D and \u201Cit went up\u201D are not on the list."},{h:"Time arbitrage",p:"Your structural edge over professionals is that nobody can fire you for a bad quarter. Institutions are forced to be short-term; you are not. That patience is the only edge you have that cannot be competed away."}],quiz:[{type:"mc",q:"Your best-researched position has grown to 35% of your portfolio. Thesis intact, valuation still reasonable. Action?",options:["Trim to 5% immediately","Hold, but define in writing the maximum loss you can absorb","Add more with borrowed money","Sell half to lock in gains"],a:1,why:"Neither dogma works. The discipline is to size by conviction AND by survivability: if a 60% decline in that one name would end your plan, it is too big regardless of conviction."},{type:"mc",q:"Which is a valid reason to sell?",options:["The stock fell 25%","A better opportunity exists and capital is limited","It has been flat for two years","A famous investor sold"],a:1,why:"Opportunity cost is the only price-independent reason on the list. The other three are noise or impatience."},{type:"tf",q:"Being unable to be fired for underperformance is a genuine structural edge for a private investor.",a:!0,why:"Time arbitrage. Most professional capital cannot hold through a three-year drawdown; you can, which is why cheap and unloved is available to you at all."}]}],Z0=[{id:"s1",title:"The 34% drawdown",tag:"Marks \xB7 Graham",setup:"A global recession hits. Your portfolio is down 34% in four months. Every headline says this is different. Your holdings are still profitable, still growing, and now trade at half their earnings multiple from last year. You have 10% cash and a 25-year horizon.",options:[{t:"Sell everything and wait for clarity",s:-3,f:"Clarity arrives only after prices have recovered. Selling here converts a temporary quote decline into a permanent loss and puts you in the position of having to be right twice."},{t:"Do nothing at all",s:1,f:"Not a mistake. But you are wasting the only thing a bear market gives you \u2014 prices below value \u2014 while holding cash you set aside for exactly this."},{t:"Deploy the cash in three tranches over the next months against a pre-written list",s:3,f:"Correct. You accept you cannot pick the bottom while guaranteeing participation. Marks: you can\u2019t predict, you can prepare. The pre-written list bypasses your worst instincts under stress."},{t:"Borrow on margin \u2014 this is a generational opportunity",s:-3,f:"Leverage is how good analysis produces bankruptcy. A further 30% decline forces you to sell at the exact bottom. Never surrender the ability to wait."}]},{id:"s2",title:"Earnings miss",tag:"Lynch \xB7 Graham",setup:"A stalwart you own misses quarterly earnings by 8% and drops 22% in a day. Reading the report: the miss came from a one-off currency effect and a factory upgrade. Volumes grew, market share grew, the balance sheet is unchanged.",options:[{t:"Sell \u2014 the market has spoken",s:-2,f:"You outsourced your judgement to a one-day price move. Mr. Market is a servant, not an oracle."},{t:"Re-check the thesis; if intact, add to the position",s:3,f:"Correct sequence: verify first, then act. Volumes and share growing while the multiple compresses is the definition of Mr. Market offering you a discount."},{t:"Hold and add nothing",s:1,f:"Defensible, but if your work says the business is unchanged and the price is 22% lower, doing nothing means you did not believe your own analysis."},{t:"Set a stop-loss 10% lower to protect yourself",s:-2,f:"Stop-losses guarantee you sell into panic. They are a trading tool applied to an investing horizon."}]},{id:"s3",title:"The friend\u2019s round",tag:"Angel \xB7 Housel",setup:"A friend is raising CHF 300,000 at a CHF 4m valuation for a hardware startup. Twelve months in, an unfinished prototype, no revenue, two paying pilot letters of intent. He asks you for CHF 15,000 \u2014 which is 60% of your liquid savings.",options:[{t:"Invest the full CHF 15,000 \u2014 you believe in him",s:-3,f:"S
