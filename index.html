ixty percent of liquid savings into a pre-revenue single position violates both power-law maths and basic survival. Belief in a person is not a portfolio strategy."},{t:"Invest CHF 2,000, sized as money already written off",s:2,f:"Sensible. Small enough to preserve both your capital base and the friendship. Consider whether you can even assess this objectively \u2014 you probably cannot."},{t:"Decline, explain honestly, offer help instead of cash",s:3,f:"The strongest answer at your capital level. Letters of intent are not revenue, and one cheque this size cannot work in a power-law asset class. Time and introductions cost you nothing and are often worth more."},{t:"Invest CHF 15,000 but demand a board seat",s:-2,f:"Governance does not fix position sizing, and a board seat on a pre-revenue startup mostly buys you an obligation."}]},{id:"s4",title:"Dividend cut warning",tag:"Income mechanics",setup:"A holding yields 8.4%. Payout ratio is 118% of free cash flow, net debt has risen for three straight years, revenue is flat, and management has publicly promised the dividend is safe.",options:[{t:"Buy more \u2014 8.4% locked in",s:-3,f:"The yield is high because the market is pricing the cut. Payout above 100% of free cash flow means the dividend is funded by debt."},{t:"Sell \u2014 the dividend is being funded by borrowing",s:3,f:"Correct. When the cut comes, you lose the income and roughly 20\u201340% of the price simultaneously. The cash flow statement outranks management reassurance every time."},{t:"Hold and collect the dividend until it is cut",s:-1,f:"You are being paid with your own capital while waiting for a predictable repricing."},{t:"Hold but stop reinvesting the dividend",s:0,f:"Half a decision. You have identified the risk and then chosen not to act on it."}]},{id:"s5",title:"The mania",tag:"Bernstein \xB7 Marks",setup:"A sector has risen 300% in 18 months. Colleagues at work compare gains daily. Valuations are 60\xD7 sales. You own none of it and have underperformed for a year. Your own boring portfolio is up 6%.",options:[{t:"Buy a small speculative position so you stop feeling left out",s:-2,f:"The stated reason is envy, which is the fourth pillar (psychology) failing. A position taken for emotional reasons will be sold for emotional reasons."},{t:"Keep to your written allocation and rebalance as normal",s:3,f:"Correct. Bernstein\u2019s history pillar exists precisely for this moment. Underperforming a mania is the price of not participating in its unwind."},{t:"Short the sector",s:-3,f:"Manias last far longer than your solvency. Being right about valuation and wrong about timing is indistinguishable from being wrong."},{t:"Sell your portfolio and rotate fully into the sector",s:-3,f:"Buying peak enthusiasm with everything you own is the textbook mechanism of permanent loss."}]},{id:"s6",title:"The cheap retailer",tag:"Value trap",setup:"A retail chain trades at 0.4\xD7 book and a P/E of 5. Same-store sales have fallen for nine consecutive quarters, online competitors are taking share, book value is mostly ageing stores on 15-year leases, and net debt is 4\xD7 EBITDA.",options:[{t:"Buy \u2014 60% below book value is a huge margin of safety",s:-3,f:"Book value only protects you if it is realisable. Leased stores and stale inventory are not worth carrying value, and the debt removes any ability to wait."},{t:"Avoid \u2014 deteriorating earnings plus leverage is a trap, not a discount",s:3,f:"Correct. The multiple falls as fast as the earnings, so the discount never closes. Graham\u2019s safety needs an asset floor or stable earning power; here there is neither."},{t:"Buy a small position as a lottery ticket",s:-1,f:"Deliberate speculation is at least honest, but leverage plus secular decline gives you a lottery ticket with negative expected value."},{t:"Wait for a catalyst \u2014 new management or a debt restructuring",s:2,f:"Reasonable discipline. Turnarounds require something to actually change; waiting for the catalyst costs you the first 20% and saves you the previous 60%."}]},{id:"s7",title:"Position size problem",tag:"Estebaranz \xB7 risk",setup:"Your highest-conviction stock has risen 5\xD7 and is now 38% of your portfolio. The thesis is intact, growth is accelerating, but the multiple has expanded from 14\xD7 to 41\xD7 earnings. This portfolio is also your emergency reserve.",options:[{t:"Hold everything \u2014 never interrupt compounding",s:0,f:"Defensible for a pure long-horizon book, but you just said this money is also your emergency reserve. Conviction does not pay rent during a 60% drawdown."},{t:"Trim to around 20\u201325% and hold the rest",s:3,f:"Correct balance. You keep the tail exposure that drives returns while ensuring one repricing cannot end your plan. Size by conviction AND by survivability."},{t:"Sell it all and lock in the gain",s:-1,f:"You would be selling a working business for the reason that it worked. Not one of the three valid sell reasons."},{t:"Add more \u2014 winners keep winning",s:-2,f:"Adding to a 38% position at 41\xD7 earnings with no separate reserve is how a single bad quarter resets a decade."}]},{id:"s8",title:"The follow-on",tag:"Angel \xB7 sunk cost",setup:"A startup you backed 18 months ago at CHF 4m is raising at CHF 16m. Revenue grew from zero to CHF 90k ARR, churn is high, the lead investor is the founder\u2019s uncle, and two of four engineers left. You have pro-rata rights: CHF 8,000 to keep your stake.",options:[{t:"Exercise pro-rata \u2014 protect your ownership",s:-2,f:"Ownership percentage is not the goal; expected value is. High churn, insider-led pricing and engineering departures at a 4\xD7 markup means you are paying more for a weaker company."},{t:"Pass, and treat the original cheque as sunk",s:3,f:"Correct. Follow-ons should be earned by evidence, not by loyalty to your earlier decision. The valuation quadrupled while the fundamentals deteriorated."},{t:"Double your pro-rata to signal support",s:-3,f:"Averaging up into deteriorating fundamentals with no independent price discovery."},{t:"Pass but ask for updated cohort and churn data first",s:2,f:"Good instinct \u2014 always ask. But the answer here is already visible in the departures and the insider-led round."}]},{id:"s9",title:"The windfall",tag:"Housel \xB7 Bernstein",setup:"You receive CHF 40,000 unexpectedly. Markets are near all-time highs. You have no debt, three months of expenses in cash, and a 25-year horizon.",options:[{t:"Invest it all immediately into your target allocation",s:2,f:"Statistically the highest expected value \u2014 markets rise more often than they fall, so time in beats timing. The risk is behavioural: a 25% drop next month could break your discipline."},{t:"Split across 6\u201312 months into the target allocation",s:3,f:"Slightly lower expected return, meaningfully higher probability that you actually stay invested. For a first large sum, the behavioural insurance is worth the small cost."},{t:"Hold cash until markets correct",s:-2,f:"All-time highs are the normal state of a rising market. Waiting for a correction has historically cost more than the corrections themselves."},{t:"Put it into the highest-yielding stocks you can find",s:-2,f:"Reaching for yield with a windfall is how people end up owning the most fragile balance sheets in the market."}]},{id:"s10",title:"The acquisition",tag:"Lynch \xB7 capital allocation",setup:"A profitable niche software company you own announces it is buying a chain of fitness studios for 40% of its market cap, funded with new debt. Management calls it a diversification into consumer wellness.",options:[{t:"Hold \u2014 management knows the business better than you",s:-1,f:"Management knows the operations. Capital allocation is a separate skill, and this is the pattern Lynch named diworsification."},{t:"Sell \u2014 the capital allocation thesis is broken",s:3,f:"Correct. Your thesis was a focused high-return software business. It just became a levered conglomerate with no synergy. That is a broken thesis, which is reason one to sell."},{t:"Buy more on the dip",s:-3,f:"You would be adding to a company that just told you it has run out of high-return ideas in its core."},{t:"Hold and watch the integration for two quarters",s:0,f:"You will learn something, but you are holding through the period when the thesis is most likely to keep degrading."}]},{id:"s11",title:"Index envy",tag:"Bernstein \xB7 honesty",setup:"Three years into stock picking, your researched portfolio has returned 5.1% per year. The global index returned 9.4%. You spend roughly six hours a week on research.",options:[{t:"Try harder \u2014 increase research hours",s:-1,f:"More effort on an unmeasured process just produces more confident errors. First find out where the gap came from."},{t:"Attribute the gap honestly, then move the core to an index and keep a small satellite",s:3,f:"Correct. Three years is short, but the discipline of benchmarking yourself and acting on the answer is rarer and more valuable than the outperformance itself."},{t:"Ignore it \u2014 value investing works over decades",s:0,f:"True, and also the sentence every underperforming investor tells themselves indefinitely. It is only valid if you can name what you got right and wrong."},{t:"Switch to a more aggressive strategy to catch up",s:-3,f:"Increasing risk to recover past underperformance is the mechanism behind most blow-ups."}]},{id:"s12",title:"The hot IPO",tag:"Marks \xB7 second level",setup:"A company you genuinely admire is going public. It grows 45% a year, is loss-making, and prices at 22\xD7 sales. Allocation is heavily oversubscribed. Everyone you know is applying.",options:[{t:"Apply for the maximum allocation",s:-2,f:"IPOs are sold, not bought \u2014 the seller has better information and picks the timing. Oversubscription is a fact about enthusiasm, not about value."},{t:"Skip it, add to the watchlist, and revisit after two or three reporting cycles",s:3,f:"Correct. Lock-up expiries and the first earnings misses often reprice these dramatically. You lose nothing by requiring public numbers before you underwrite them."},{t:"Buy on the first day of trading",s:-2,f:"You are buying the moment sentiment is at its structural maximum."},{t:"Buy a token amount to learn from it",s:0,f:"Paying tuition is legitimate, but the lesson here is available for free by watching."}]}],An=[{t:"VWRL",n:"FTSE All-World ETF",sec:"Index fund",cat:"Index",p0:128,eps:6.4,g:.07,dy:.017,moat:3,vol:.032,note:"The benchmark. Owning it is the default that your stock picking must beat."},{t:"KO",n:"Coca-Cola",sec:"Consumer staples",cat:"Stalwart",p0:71,eps:2.95,g:.05,dy:.029,moat:5,vol:.038,note:"Buffettology archetype: brand, distribution, pricing power, low capital needs."},{t:"NESN",n:"Nestl\xE9",sec:"Consumer staples",cat:"Stalwart",p0:82,eps:4.6,g:.04,dy:.035,moat:4,vol:.036,note:"Swiss stalwart. Slow, defensive, dividend-driven total return."},{t:"ROG",n:"Roche",sec:"Healthcare",cat:"Stalwart",p0:268,eps:17.5,g:.04,dy:.037,moat:4,vol:.042,note:"Patent cliffs make the growth rate lumpier than it looks."},{t:"MSFT",n:"Microsoft",sec:"Software",cat:"Fast grower",p0:430,eps:13.1,g:.13,dy:.007,moat:5,vol:.055,note:"Switching costs plus enterprise lock-in. Rarely statistically cheap."},{t:"AAPL",n:"Apple",sec:"Hardware",cat:"Stalwart",p0:225,eps:6.9,g:.08,dy:.005,moat:5,vol:.052,note:"Ecosystem moat and buybacks. Growth now closer to a stalwart."},{t:"V",n:"Visa",sec:"Payments",cat:"Fast grower",p0:290,eps:10.2,g:.11,dy:.008,moat:5,vol:.048,note:"Two-sided network, near-zero marginal cost. The moat textbook case."},{t:"COST",n:"Costco",sec:"Retail",cat:"Stalwart",p0:900,eps:17.5,g:.09,dy:.005,moat:4,vol:.05,note:"Membership economics. Quality is obvious, which is why it is rarely cheap."},{t:"JNJ",n:"Johnson & Johnson",sec:"Healthcare",cat:"Slow grower",p0:158,eps:10.1,g:.04,dy:.031,moat:4,vol:.035,note:"Defensive, litigation-exposed, decades of dividend increases."}
