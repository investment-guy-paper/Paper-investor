4 the payout is comfortably covered","Tight \u2014 covered for now, but a downturn would force a decision","A cut is coming \u2014 the dividend is funded by borrowing","Safe, because management has publicly committed to it"];return{type:"mc",q:`A company yields ${r}%. It pays out ${t}% of free cash flow, and net debt has ${a}. Management says the dividend is secure. What is your read?`,options:n,a:e==="safe"?0:e==="tight"?1:2,steps:[e==="safe"?`${t}% of free cash flow leaves real headroom, and debt is falling. This dividend can grow.`:e==="tight"?`${t}% is covered but leaves almost no margin. One bad year and the company must choose between the dividend and the balance sheet.`:`${t}% of free cash flow means the company is paying you with borrowed money. The ${r}% yield is high because the market has already priced the cut.`,"The cash flow statement outranks management reassurance every time. Option 4 is never the answer."]}}},{id:"moattest",name:"Moat or commodity?",lesson:"4a",cat:"Judgement",concept:!0,gen:()=>{let e=Math.random()<.5,t=e?ue(1,3):ue(18,35),r=e?`${ue(18,26)}% every year for a decade`:`swinging between ${ue(2,6)}% and ${ue(14,19)}%`,a=["A consumer monopoly \u2014 it has pricing power","A commodity business \u2014 it competes on price","Impossible to judge without knowing the P/E","A consumer monopoly, because the brand is well known"];return{type:"mc",q:`A company raises prices 10%. Volumes fall ${t}%. Its ROE has been ${r}. Which is it?`,options:a,a:e?0:1,steps:[e?`Customers grumbled and paid: a ${t}% volume loss against a 10% price rise means revenue still went up. Add a decade of stable high ROE and you have structural pricing power \u2014 inflation becomes an ally.`:`A ${t}% volume loss against a 10% price rise means revenue fell. Customers switched to whoever is cheapest, and the swinging ROE confirms there is no structure protecting profits.`,"The pricing power test settles it faster than any ratio. Brand recognition alone (option 4) proves nothing \u2014 plenty of famous brands earn commodity returns."]}}},{id:"leveragecmp",name:"Which business is stronger?",lesson:"4a",cat:"Judgement",concept:!0,gen:()=>{let e=ue(12,24),t=ye([1,2]),r=5,a=t*(e-r)/(1+t),n=[-6,-4,-3,3,4,6].filter(f=>f>-a+1),o=Math.max(7,e+ye(n.length?n:[3,4,6])),i=se(o+(o-r)*t),s=i,l=100*(1+t),u=o>e,c=[`A \u2014 return on capital of ${e}%`,`B \u2014 return on capital of ${se(o)}%`,"B, because its ROE is higher","Identical once you adjust for tax"];return{type:"mc",q:`Company A: ROE ${e}%, no debt. Company B: ROE ${i}%, debt/equity of ${t}, borrowing at ${r}%. Which is the stronger business?`,options:c,a:u?1:0,steps:[`Strip the leverage out. A has no debt, so its return on capital is its ROE: ${e}%.`,`B earns ${s} on equity of 100, but ${l} of capital is at work and it pays ${se(r*t)} of interest. Return on capital = (${s} + ${se(r*t)}) \xF7 ${l} = ${se(o)}%.`,u?"So B really is the better business \u2014 its higher ROE is not purely borrowed.":"So A is the better business. B's higher ROE was bought with debt, and it will vanish in the first bad year while the interest still has to be paid."]}}},{id:"sizing",name:"Position too big?",lesson:"10a",cat:"Judgement",concept:!0,gen:()=>{let e=ye([8,12,18,26,34,42]),t=Math.random()<.25,r=Math.random()<.5,a=["Hold \u2014 never interrupt compounding","Trim back toward 20\u201325%","Sell \u2014 the thesis is broken","Add more, conviction deserves weight"],n,o;return t?(n=2,o="The thesis has broken, and that is the first valid reason to sell. Position size is irrelevant once the reason you owned it no longer holds."):e>=30&&r?(n=1,o=`At ${e}% with this money doubling as your emergency reserve, a 60% fall in one name would end your plan. Conviction does not pay rent during a drawdown \u2014 size by survivability as well as belief.`):e>=30&&!r?(n=0,o=`${e}% is concentrated, but the thesis is intact and this is not money you can be forced to sell. Estebaranz would hold \u2014 provided you have written down what a 60% fall would mean.`):(n=0,o=`At ${e}% this is a normal-sized position with the thesis intact. Trimming a working investment because it went up is not one of the three valid reasons to sell.`),{type:"mc",q:`Your position has grown to ${e}% of your portfolio. The thesis is ${t?"broken \u2014 the company just made a large unrelated acquisition":"intact and the valuation is still reasonable"}. This portfolio ${r?"is also your emergency reserve":"is money you cannot be forced to sell"}. What do you do?`,options:a,a:n,steps:[o,"The three valid reasons to sell: the thesis broke, the price exceeds any reasonable value, or something clearly better needs the capital."]}}},{id:"angelgo",name:"Angel: write the cheque?",lesson:"9a",cat:"Judgement",concept:!0,gen:()=>{let e=Math.random()<.5,t=e?ue(8,40)*1e4:0,r=se(e?1+Math.random()*2:9+Math.random()*6),a=ye([2,3,5])*1e3,n=ye([15,25,40])*1e3,o=[`Invest CHF ${te(a)}, sized as money already written off`,"Pass \u2014 the evidence is not there",`Invest CHF ${te(n*.6)} to make it count`,"Invest, but only with a board seat"];return{type:"mc",q:`A startup is raising. ${e?`It has CHF ${te(t)} of annual recurring revenue from customers who are strangers, and ${r}% monthly churn.`:`It has no revenue after 18 months, ${r}% monthly churn on its free trials, and heavy press coverage.`} You have CHF ${te(n)} of liquid savings. The ask is CHF ${te(a)}.`,options:o,a:e?0:1,steps:[e?`Revenue from strangers plus ${r}% churn is real evidence. CHF ${te(a)} is ${se(a/n*100)}% of your liquid savings \u2014 small enough to be one of the twenty shots the power law requires.`:`No revenue after 18 months and ${r}% churn is a leaking bucket. Press is a marketing output, not demand.`,`Option 3 is always wrong at this capital level: ${te(n*.6)} is 60% of your savings in one illiquid position. Option 4 confuses governance with position sizing.`]}}},{id:"mosneeded",name:"Is the discount big enough?",lesson:"2b",cat:"Judgement",concept:!0,gen:()=>{let e=ye(["utility","stalwart","cyclical"]),t=e==="utility"?20:e==="stalwart"?30:50,r=ue(10,60),a=e==="utility"?"a regulated Swiss utility with very predictable cash flows":e==="stalwart"?"a stable consumer goods company growing 5% a year":"a cyclical chemicals group whose profits swing wildly with the economy",n=["Yes \u2014 the discount covers the uncertainty in your estimate","No \u2014 this business needs a bigger discount before it is safe","Yes, because any discount is a margin of safety","It does not matter as long as the dividend is covered"];return{type:"mc",q:`You are looking at ${a}. Your valuation is rough. The price offers a ${r}% discount to your estimate. Is that enough?`,options:n,a:r>=t?0:1,steps:[`The discount you require should rise with how uncertain your estimate is. For this business, roughly ${t}% is a sensible floor.`,r>=t?`A ${r}% discount clears that bar \u2014 your estimate could be ${r}% too optimistic and you still would not have overpaid.`:`A ${r}% discount does not clear it. With earnings this hard to predict, a small discount is no protection at all.`,"Margin of safety exists because your forecast will be wrong, not because you expect a particular gain."]}}},{id:"recall",name:"Term recall",lesson:"1a",cat:"Vocabulary",concept:!0,gen:()=>{let e=Object.keys(le),t=ye(e),r=[];for(;r.length<3;){let n=ye(e);n!==t&&!r.includes(n)&&r.push(n)}let a=[t,...r].sort(()=>Math.random()-.5);return{type:"mc",q:`Which term means this?

"${le[t].d}"`,options:a.map(n=>le[n].t),a:a.indexOf(t),steps:[le[t].t,le[t].f?le[t].f:le[t].d,le[t].w||""].filter(Boolean)}}},{id:"formularecall",name:"Formula recall",lesson:"2a",cat:"Vocabulary",concept:!0,gen:()=>{let e=Object.keys(le).filter(n=>le[n].f),t=ye(e),r=[];for(;r.length<3;){let n=ye(e);n!==t&&!r.includes(n)&&r.push(n)}let a=[t,...r].sort(()=>Math.random()-.5);return{type:"mc",q:`Which formula belongs to ${le[t].t.split(" (")[0]}?`,options:a.map(n=>le[n].f),a:a.indexOf(t),steps:[le[t].t,le[t].f,le[t].ex||le[t].w||""].filter(Boolean)}}}],uw=[0,1,3,7,16,35],qs=uw.length-1,fw=864e5;var k={bg:"#0A1017",surface:"#121A24",surface2:"#18222E",line:"#22303D",text:"#E8E5DE",dim:"#8A97A6",brass:"#D6A64A",gain:"#3FA97A",loss:"#D06A5A",cool:"#5B8DB8"},oa="Georgia, 'Iowan Old Style', 'Times New Roman', serif",Vt="ui-monospace, 'SF Mono', Menlo, Consolas, monospace",cw=[{id:1,name:"Money & Behaviour",source:"Housel \xB7 Stanley & Danko",color:k.brass},{id:2,name:"Mr. Market",source:"Graham \u2014 The Intelligent Investor",color:k.cool},{id:3,name:"Know What You Own",source:"Lynch \u2014 One Up on Wall Street",color:k.gain},{id:4,name:"Moats",source:"Buffettology \u2014 Buffett & Clark",color:k.brass},{id:5,name:"Valuation",source:"Pignataro \xB7 Sander & Haley \xB7 Little Book",color:k.cool},{id:6,name:"Risk & Cycles",source:"Marks \u2014 The Most Important Thing",color:k.loss},{id:7,name:"Portfolio Architecture",source:"Bernstein \u2014 Four Pillars",color:k.gain},{id:8,name:"Passive Income",source:"Dividends, ETFs, Swiss tax reality",color:k.brass},{id:9,name:"Startup / Angel",source:"Power law, dilution, SAFEs",color:k.cool},{id:10,name:"Conviction",source:"Estebaranz \u2014 The Art of Investing",color:k.gain}],Nn=[{id:"1a",unit:1,title:"Behaviour beats IQ",cards:[{h:"Investing is not a maths exam",p:"Housel\u2019s core claim: financial outcomes are driven by how you behave under stress, not by what you know. A person with average knowledge and iron discipline destroys a genius who panics. Every strategy in this app dies the moment you abandon it at the bottom."},{h:"Luck and risk are siblings",p:"Every visible outcome contains both. That means you cannot judge a decision by its result \u2014 you judge it by the process that produced it. Copying someone because they got rich is how you inherit their risk without their luck."},{h:"Getting rich \u2260 staying rich",p:"Getting wealthy takes optimism and risk. Staying wealthy takes paranoia, low burn and survival. Only survival compounds: a portfolio that returns 20%, 20%, then \u221260% has lost money. Nothing beats being able to stay in the game."},{h:"The rule of 72",p:"Divide 72 by your annual return and you get the number of years your money takes to double. At 9% a year: 72 \xF7 9 = 8 years. At 6%: twelve years. At 3%: twenty-four. You can do it in your head, which is the entire point \u2014 it turns a vague promise into a number you can check."},{h:"Doubling is what does the work",p:"The rule matters because doubling repeats on the same clock. CHF 5,000 at 7% doubles roughly every 10 years: 10,000 at 28, 20,000 at 38, 40,000 at 48, 80,000 at 58. Notice the last doubling adds CHF 40,000 \u2014 more than the first four combined. This is why the years you invest early are worth more than the amounts you invest later, and why the most expensive decision is waiting."},{h:"Running it backwards",p:"Flip it and it becomes a lie detector. Someone promising to double your money in two years is claiming 36% a year (72 \xF7 2), roughly triple what the best investors alive sustain \u2014 so either the risk is enormous or the claim is false. It also prices fees: a 1.5% annual fee turns a 7% return into 5.5%, stretching each doubling from 10 years to 13. Over a lifetime that is one entire doubling lost. Treat it as an estimate; it is most accurate between about 5% and 15%."}],quiz:[{type:"mc",q:"A friend put 90% of his savings into one coin and tripled it in six months. What is the correct conclusion?",options:["He found an edge \u2014 ask him what to buy next","The outcome is loud but proves nothing about the decision quality","Concentration always beats diversification","He is a better investor than you"],a:1,why:"Judge process, not outcome. A high-variance bet that paid once tells you almost nothing about expected value. This is Housel\u2019s luck/risk pair and Marks\u2019 point that you must evaluate the decision as it looked before the result was known."},{type:"tf",q:"A 25% average annual return with one \u221270% year beats a steady 12% over 20 years.",a:!1,why:"Compounding is multiplicative. One catastrophic year permanently removes the base that everything after it compounds on. Survival > peak return."},{type:"num",q:"Rule of 72: at a 9% annual return, roughly how many years to double your money?",a:8,tol:.6,unit:"years",why:"72 \xF7 9 = 8 years. The rule of 72 is your fastest mental check on whether a return assumption is realistic."}]},{id:"1b",unit:1,title:"Wealth is what you don\u2019t see",sc:"s9",cards:[{h:"The PAW formula",p:"Stanley & Danko: expected net worth \u2248 age \xD7 annual pre-tax income \xF7 10. Hit double that and you are a Prodigious Accumulator of Wealth (PAW). Half or less makes you an Under Accumulator (UAW) \u2014 regardless of how big your salary is."},{h:"Income is not wealth",p:"Wealth is the income you did not spend. A visible lifestyle is evidence of spending, not of assets. \u201CBig hat, no cattle\u201D is the single most expensive mistake young high earners make."},{h:"The one variable you control",p:"You cannot control returns. You can control your savings rate, your costs and your time horizon. At 18, time horizon is the largest asset on your balance sheet and it is non-renewable."}],quiz:[{type:"num",q:"You are 34 and earn CHF 90,000 pre-tax. What is the expected net worth benchmark (in CHF)?",a:306e3,tol:3e3,unit:"CHF",why:"34 \xD7 90,000 \xF7 10 = CHF 306,000. Doubling that (CHF 612,000) would classify you as a PAW."},{type:"mc",q:"Two neighbours: A earns 200k and has 80k net worth. B earns 70k and has 400k. Who is the better investor?",options:["A \u2014 higher earning power","B \u2014 converts income into assets","Impossible to say","Neither, both are below benchmark"],a:1,why:"B has a far higher conversion rate of income into capital. Stanley\u2019s research found most millionaires were in unglamorous businesses with high defence (saving) rather than record offence (earning)."},{type:"tf",q:"Raising your savings rate from 10% to 20% roughly halves the time to financial independence.",a:!0,why:"It works from both ends: you accumulate faster AND you need a smaller pot because your annual spending is lower. Savings rate is the single most powerful lever before your capital gets large."}]},{id:"2a",unit:2,title:"Mr. Market",sc:"s2",cards:[{h:"Graham\u2019s parable (Ch. 8)",p:"Imagine a manic business partner who shows up every day quoting a price to buy your share or sell you his. Some days he is euphoric, some days terrified. He is there to serve you, not to instruct you. You are free to ignore him entirely."},{h:"Price is what you pay",p:"A falling price is new information about sentiment, not automatically about the business. The only question that matters: has the earning power of the business changed, or only the mood of the crowd?"},{h:"Discount to value: the calculation",p:"Once you have an estimate of what a business is worth, you need one number to describe how good today's price is. That number is the discount to value: subtract the price from your value estimate, then divide by your value estimate. You think it is worth CHF 100 and it trades at CHF 62 \u2192 (100 \u2212 62) \xF7 100 = 0.38, a 38% discount. Always divide by the value, never by the price \u2014 dividing by price answers a different question."},{h:"What the discount is actually for",p:"It is your error budget, not your profit forecast. A 38% discount means your valuation could turn out to be 38% too optimistic and you would still not have overpaid. Graham wanted at least a third off for exactly this reason. It also puts every opportunity on one scale: a bank at a 40% discount and a software firm at 10% become directly comparable, no matter how different the businesses are."},{h:"The asymmetry hidden inside it",p:"Discount and upside are not the same number. Buying at CHF 62 something worth CHF 100 is a 38% discount but a 61% gain if the price ever reaches value (100 \xF7 62 \u2212 1). The deeper the discount, the more violently the two diverge: a 50% discount is a 100% gain, a 75% discount is a 300% gain. This is the whole mechanical argument for waiting \u2014 patience does not improve the business, it improves the arithmetic. And the size of the discount you demand should rise with how uncertain your estimate is: a stable Swiss utility might justify buying at 20% off, a cyclical whose profits swing wildly might need 50%."},{h:"Defensive vs enterprising",p:"Graham splits investors by effort, not by risk appetite. The defensive investor buys broad index funds and rebalances. The enterprising investor does the work \u2014 statements, competitors, valuation. Choose honestly: the worst outcome is enterprising ambition with defensive effort."}],quiz:[{type:"mc",q:"A company you own drops 30% in a week. No news about the business. Correct first action?",options:["Sell \u2014 the market knows something","Re-run your valuation; if unchanged, consider buying more","Average down immediately without checking","Set a stop-loss at \u221235%"],a:1,why:"Mr. Market offering a lower price is an option, not a verdict. But re-checking your thesis first is mandatory \u2014 automatically averaging down is how value traps eat you (Unit 5)."},{type:"num",q:"You estimate intrinsic value at CHF 100. The market price is CHF 62. What discount to value are you buying at (%)?",a:38,tol:1,unit:"%",why:"(100 \u2212 62) \xF7 100 = 38%. Graham wanted a large gap precisely because your estimate of 100 might be wrong."},{type:"tf",q:"Volatility and risk are the same thing.",a:!1,why:"Marks and Graham both reject this. Volatility is price movement; risk is the permanent loss of capital. A stable stock with a levered balance sheet is often riskier than a jumpy one with net cash."}]},{id:"2b",unit:2,title:"Margin of safety",cards:[{h:"The three words (Ch. 20)",p:"Graham reduced sound investing to \u201Cmargin of safety\u201D: buy so far below your estimate of value that being wrong still leaves you whole. It is not a prediction tool \u2014 it is an admission that your forecast will be wrong."},{h:"Where safety comes from",p:"Three sources: a low price relative to value, a business whose earning power is durable, and diversification so that a single error is not fatal. Stack them; never rely on one."},{h:"How much debt is too much",p:"The standard measure is net debt \xF7 EBITDA \u2014 roughly, how many years of operating profit it would take to repay everything the company owes. Under 2\xD7 is comfortable. Around 3\xD7 is stretched. Above 4\xD7, the lenders effectively set the strategy, not the management. A company at 4\xD7 with falling sales is in the worst possible position: as profits shrink the ratio worsens on its own, and when the loan comes up for renewal the bank can demand repayment, a share issue that dilutes you, or asset sales at terrible prices."},{h:"Why debt destroys safety",p:"Your one structural advantage as a private investor is that nobody can force you to act \u2014 you can hold for a decade while the market changes its mind. Debt removes exactly that advantage from the company you own. A cheap, unlevered business can sit out a bad five years; a cheap, heavily indebted one can be wiped out during them, with the shares going to zero while the assets go to the lenders. This is why a low P/E means nothing until you have checked the balance sheet."},{h:"Graham's two ceilings",p:"For cautious investors Graham set two separate price limits. Never pay more than 15 times annual profit \u2014 that is a P/E of 15. And never pay more than 1.5 times the company's accounting value \u2014 that is a P/B of 1.5. The first limits what you pay for profits, the second limits what you pay for assets."},{h:"Where the 22.5 comes from",p:"Applying both limits rigidly is too strict: a company with unusually cheap assets but a slightly high P/E would be rejected for no good reason. So Graham let one ceiling be breached if the other is low enough to compensate. He simply multiplied them: 15 \xD7 1.5 = 22.5. That single number is the entire origin of the formula \u2014 nothing mystical, just his two rules combined into one. This is what 'the combined earnings and assets limit' means."},{h:"The Graham number",p:"The formula turns that combined ceiling into a maximum price per share: \u221A(22.5 \xD7 EPS \xD7 book value per share). Take EPS of CHF 3 and book value per share of CHF 20 \u2192 22.5 \xD7 3 \xD7 20 = 1350, and \u221A1350 \u2248 CHF 36.74. That is the most a defensive investor should pay. The square root is there because you multiplied two per-share figures together, so you need to bring the result back down to a single per-share price."},{h:"Reading the result",p:"At CHF 36.74 the P/E is 12.2 (36.74 \xF7 3) and the P/B is 1.84 (36.74 \xF7 20). The P/E sits below the limit of 15 while the P/B sits above 1.5 \u2014 the cheap earnings are paying for the expensive assets, which is exactly the trade Graham allowed. Multiply the two and you get 22.5 again. Pay more than CHF 36.74 and you break the combined ceiling."},{h:"When to ignore it",p:"It is a screening filter, not an analysis. It works on banks, insurers, industrials and property \u2014 businesses whose value genuinely sits on the balance sheet. It is useless for software, brands or anything whose worth is code, patents and people, because those barely appear in book value. Applied to Microsoft it would have told you to never buy at any price for thirty years."}],quiz:[{type:"num",q:"EPS is CHF 3.00 and book value per share is CHF 20. What is the Graham number (CHF)?",a:36.74,tol:1,unit:"CHF",why:"22.5 \xD7 3 \xD7 20 = 1350, and \u221A1350 \u2248 36.74. Remember the 22.5 is just Graham\u2019s two limits multiplied together: 15 times earnings \xD7 1.5 times book value. At CHF 36.74 you would be paying a P/E of 12.2 and a P/B of 1.84 \u2014 cheap on profits, dear on assets, which nets out to exactly his ceiling. Pay more and you breach it."},{type:"mc",q:"Which position has the weakest margin of safety?",options:["Profitable, net cash, bought at 40% below your DCF","Cheap on P/E but 4\xD7 net debt/EBITDA and falling sales","Boring stalwart at fair value with 25 years of dividends","Index fund bought after a 30% market decline"],a:1,why:"Statistical cheapness plus leverage plus deterioration is the classic value trap. Debt removes your ability to wait, which is the whole asset of a long-horizon investor."},{type:"tf",q:"Margin of safety means you have accurately predicted the future.",a:!1,why:"The opposite. It exists because you have not."}]},{id:"3a",unit:3,title:"Lynch\u2019s six categories",cards:[{h:"Classify before you value",p:"Lynch: you cannot judge a result without knowing the game. Slow growers (2\u20134% growth, big dividend), stalwarts (8\u201312%, defensive compounders), fast growers (20%+, where tenbaggers live), cyclicals (earnings swing with the economy), turnarounds (broken but fixable), asset plays (worth more dead than alive)."},{h:"Cyclicals invert the rules",p:"For a cyclical, a low P/E is usually a warning that earnings are at a peak, and a high or negative P/E can mark the bottom. Applying a stalwart\u2019s logic to a cyclical is one of the most common ways private investors lose money."},{h:"Know what you own",p:"The two-minute drill: if you cannot explain in two minutes why you own it \u2014 what the company sells, why it wins, what has to go right \u2014 you do not own an investment, you own a ticker."}],quiz:[{type:"mc",q:"A steel producer trades at a P/E of 4 after two record years. Most likely reading?",options:["Deep value \u2014 buy aggressively","Peak-cycle earnings; the low P/E is a warning","A fast grower being ignored","An asset play"],a:1,why:"Classic Lynch cyclical. The E in P/E is inflated by the cycle top. You want cyclicals when the P/E looks terrible and capacity is being shut down."},{type:"mc",q:"Nestl\xE9-type business: 4\u20136% growth, huge brand portfolio, reliable dividend. Category?",options:["Fast grower","Turnaround","Stalwart","Asset play"],a:2,why:"Stalwart. Expect 30\u201350% gains over years plus dividends, not tenbaggers. Lynch sized these to cushion drawdowns, not to drive returns."},{type:"tf",q:"\u201CInvest in what you know\u201D means buying a product you like is sufficient research.",a:!1,why:"Lynch is misquoted constantly. Familiarity generates the idea; the financials decide the investment. He explicitly demanded you check the balance sheet and growth rate afterwards."}]},{id:"3b",unit:3,title:"PEG, tenbaggers, diworsification",sc:"s10",cards:[{h:"PEG in one line",p:"P/E divided by the earnings growth rate. Below 1 is interesting, around 0.5 is very attractive, above 2 you are paying for growth that must actually arrive. Lynch used it to compare businesses that are otherwise not comparable."},{h:"Tails drive the portfolio",p:"Lynch\u2019s record came from a small number of tenbaggers that paid for many losers. Because a stock can only fall 100% but rise 1,000%, you can be wrong more than half the time and still win \u2014 if you let winners run and size losers small."},{h:"Diworsification",p:"Watch for companies buying unrelated businesses with shareholder cash. It usually signals that management has run out of high-return ideas in its core and would rather build an empire than return capital."}],quiz:[{type:"num",q:"P/E is 18 and sustainable earnings growth is 24%. What is the PEG?",a:.75,tol:.05,why:"18 \xF7 24 = 0.75. Below 1 means you are paying less than a point of P/E per point of growth."},{type:"mc",q:"Your position is up 240% and now looks expensive on P/E, but growth is accelerating and the runway is long. Lynch\u2019s instinct?",options:["Sell \u2014 never let a gain turn into a loss","Trim to the original size mechanically","Hold while the story is intact; selling winners early caps your tails","Double down with leverage"],a:2,why:"\u201CPulling the flowers and watering the weeds.\u201D The sell decision is driven by the story breaking, not by the price having gone up."},{type:"tf",q:"A software company acquiring a chain of restaurants is a positive signal about capital allocation.",a:!1,why:"Textbook diworsification."}]},{id:"4a",unit:4,title:"Consumer monopoly vs commodity",cards:[{h:"The two business types",p:"Buffett & Clark split the world in two. Commodity businesses sell an undifferentiated product, compete on price, and earn low returns forever. Consumer monopolies own something in the customer\u2019s head or in the infrastructure \u2014 a brand, a habit, a network, a switching cost \u2014 and can raise prices without losing volume."},{h:"The pricing power test",p:"Ask one question: if this company raised prices 10% tomorrow, what happens? If volumes collapse, it is a commodity. If customers grumble and pay, you have found a moat \u2014 and inflation becomes an ally rather than an enemy."},{h:"ROE consistency",p:"Buffettology screens for return on equity consistently above ~15% without heavy debt, over 10 years. Consistency matters more than the peak: a single good year is noise, a decade is evidence of structure."},{h:"Debt to equity",p:"This ratio compares what a company has borrowed against the owners' money inside it: total debt \xF7 shareholders' equity. A ratio of 3 means CHF 3 borrowed for every CHF 1 the owners put in \u2014 the lenders have supplied three quarters of the capital. Below 1 is generally comfortable. Above 2 demands a genuinely stable business, like a regulated utility or long-let property. Around 3 for an ordinary company is aggressive, because the interest bill has to be paid in bad years as well as good ones."},{h:"How debt fakes a good ROE",p:"This is why the ratio matters when judging ROE. Company A has CHF 100 of equity, no debt, and earns CHF 22 \u2192 ROE of 22%. Company B has CHF 100 of equity and CHF 300 of debt, so CHF 400 is at work. That capital earns CHF 45, interest costs CHF 15, leaving CHF 30 of profit \u2192 ROE of 30%. B looks better. But B's underlying business earns 45 on 400, about 11%, while A earns 22 on 100. A is roughly twice the business. B simply borrowed the difference."},{h:"What happens in a bad year",p:"Now halve both companies' operating profits. A earns CHF 11 \u2192 ROE of 11%, unpleasant but survivable. B earns CHF 22.50 and still owes CHF 15 of interest, leaving CHF 7.50 \u2192 ROE of 7.5%. Drop a little further and B's profit is gone entirely, the loan covenants break, and the bank starts making the decisions. Leverage does not create returns, it borrows them from your future ability to survive. This is exactly why Buffett wants high ROE achieved without much debt: the return has to come from the business, not from the balance sheet."}],quiz:[{type:"mc",q:"Which is most likely a consumer monopoly?",options:["An airline on the Zurich\u2013London route","A payment network taking a fee on every card swipe","A generic paper mill","A regional construction contractor"],a:1,why:"A payment network has a two-sided network effect: more cards attract more merchants, which attract more cards. Airlines, mills and contractors compete on price and capacity."},{type:"mc",q:"Company A: ROE 22% every year for 10 years, low debt. Company B: ROE 30% but debt/equity of 3. Which is the stronger business?",options:["B \u2014 higher ROE","A \u2014 the return is not manufactured by leverage","Identical","B, if interest rates stay low"],a:1,why:"A. A debt/equity of 3 means CHF 3 borrowed per CHF 1 of owners' money, so B's extra ROE is bought rather than earned \u2014 strip the leverage out and B's underlying return on capital is roughly half of A's. Consistency without debt is evidence of a real advantage; a high ROE built on borrowing disappears in the first bad year, when the interest still has to be paid."},{type:"tf",q:"A strong brand alone guarantees a moat.",a:!1,why:"The brand must translate into pricing power or repeat purchase. Plenty of famous brands earn commodity returns."}]},{id:"4b",unit:4,title:"Equity bonds & the retained earnings test",cards:[{h:"Stocks as equity bonds",p:"Buffett reframes a share as a bond whose coupon is EPS and whose face value is book value \u2014 except the coupon grows. If you pay CHF 60 for EPS of CHF 4, your initial \u201Ccoupon yield\u201D is 6.7%, and the question becomes how fast that coupon grows."},{h:"The one-dollar test",p:"For every franc of earnings retained rather than paid out, has the company created at least one franc of market value over time? If not, management is destroying capital and the dividend should be higher."},{h:"Projecting a return",p:"Grow today\u2019s EPS at a conservative rate for 10 years, apply a conservative exit multiple, add dividends, then compute the annual return from today\u2019s price. If that number is not clearly above what an index gives you, do nothing."}],quiz:[{type:"num",q:"EPS is CHF 5, growing 12% for 10 years. What is EPS in year 10 (CHF)?",a:15.53,tol:.6,unit:"CHF",why:"5 \xD7 1.12^10 \u2248 15.53. This is the whole engine of long-horizon investing: the multiple is noise, the earnings path is signal."},{type:"num",q:"That year-10 EPS of 15.53 at an exit P/E of 15 gives ~CHF 233. You pay CHF 60 today. What is the approximate annual return (%)?",a:14.5,tol:1.5,unit:"%",why:"(233 \xF7 60)^(1/10) \u2212 1 \u2248 14.5% per year before dividends. Now compare it against a global index at ~7% \u2014 this is how you decide whether the work was worth it."},{type:"tf",q:"A company retaining all earnings while its market value stagnates for a decade passes the one-dollar test.",a:!1,why:"It fails. That capital would have been worth more in your hands."}]},{id:"5a",unit:5,title:"What a business is actually worth",cards:[{h:"Four lenses",p:"Asset value (what the balance sheet is worth), earnings power value (current profits capitalised, assuming zero growth), growth value (only real when returns exceed the cost of capital), and comparables (what the market pays for similar businesses). Value investors weight the first two heavily because they require the fewest assumptions."},{h:"P/E is a shortcut, not a value",p:"A P/E is the answer to a DCF you did not do. It bundles growth, risk, capital intensity and accounting policy into one number. Use it to compare, never to conclude."},{h:"Quality of earnings",p:"Profit is an opinion, cash is a fact. Check whether net income converts into operating cash flow. If receivables and inventories consistently grow faster than sales, the earnings are being manufactured on paper."}],quiz:[{type:"mc",q:"Two companies both earn CHF 100m. A needs CHF 90m of capex to stand still, B needs CHF 15m. Which is worth more?",options:["Equal \u2014 same earnings","A \u2014 heavier assets","B \u2014 far more of the profit is actually distributable","Cannot say without the P/E"],a:2,why:"Owner earnings, not net income, is what you can take out. Capital intensity is the difference between a compounder and a treadmill."},{type:"tf",q:"Sales growing 8% while receivables grow 40% is a normal, healthy pattern.",a:!1,why:"It usually means revenue is being recognised on sales that have not been collected \u2014 a classic earnings-quality red flag."},{type:"mc",q:"Which valuation input do you have the least ability to forecast?",options:["Current book value","Trailing free cash flow","The terminal multiple in 10 years","This year\u2019s dividend"],a:2,why:"The terminal value usually drives 60\u201380% of a DCF and is the least knowable input. Pignataro\u2019s modelling discipline is precisely about knowing which assumptions carry the answer."}]},{id:"5b",unit:5,title:"Owner earnings & DCF mechanics",cards:[{h:"Owner earnings",p:"Net income + depreciation & amortisation \u2212 maintenance capex \xB1 working capital change. Buffett\u2019s definition of what the owner can actually pull out of the business each year without shrinking it."},{h:"The DCF in one sentence",p:"Project free cash flow for 5\u201310 years, discount each year back at your required return (or WACC), add a terminal value, subtract net debt, divide by shares. Everything else is decoration."},{h:"The discount rate is your hurdle",p:"In practice most private investors skip WACC and use a required return: \u201CI want 10% a year, what can I pay?\u201D That inverts the model into a decision tool instead of a false precision machine."}],quiz:[{type:"num",q:"Net income 120, D&A 40, maintenance capex 55, working capital increase 10. Owner earnings?",a:95,tol:1,why:"120 + 40 \u2212 55 \u2212 10 = 95. Growth capex is excluded; only what is needed to stand still is subtracted."},{type:"num",q:"A business will produce CHF 10m of cash flow forever with no growth. You require a 10% return. Maximum price?",a:100,tol:2,unit:"m CHF",why:"Perpetuity value = cash flow \xF7 discount rate = 10 \xF7 0.10 = CHF 100m. Everything above that is you accepting a lower return."},{type:"tf",q:"A DCF with 20 years of detailed projections is more reliable than one with 5 years plus a conservative terminal value.",a:!1,why:"Longer projections add precision, not accuracy. The extra years mostly encode your optimism."}]},{id:"5c",unit:5,title:"Cheap vs value trap",sc:"s6",cards:[{h:"The trap",p:"A low multiple on declining earnings is not cheap \u2014 it is expensive in slow motion. The multiple falls as fast as the earnings do, so the price never rises. Newspapers, video rental, mall retail: all were statistically cheap the whole way down."},{h:"What separates value from trap",p:"Three things: a balance sheet strong enough to wait, earnings that stabilise rather than erode, and something that changes \u2014 a catalyst, new management, a divestment, a buyback at a low price."},{h:"Quality at a fair price",p:"The Little Book approach still works (low P/B, low P/E, insider buying, dividends), but modern practice adds a durability filter. Buffett\u2019s shift: better to buy a wonderful business at a fair price than a fair business at a wonderful price."}],quiz:[{type:"mc",q:"Which single fact most reliably distinguishes value from value trap?",options:["Low P/E","High dividend yield","Stabilising or growing owner earnings","A famous investor owns it"],a:2,why:"Everything else is a snapshot. Whether cash generation has stopped deteriorating tells you if the discount can ever close."},{type:"tf",q:"Insiders buying shares with their own money is a meaningful positive signal.",a:!0,why:"Insiders sell for many reasons but buy for essentially one. It is one of the few signals with persistent statistical support."},{type:"mc",q:"A retailer trades at 0.4\xD7 book. Book is mostly ageing stores on long leases and slow-moving inventory. Real margin of safety?",options:["Yes \u2014 60% below book","No \u2014 the book value is unlikely to be realisable","Yes if the dividend holds","Only if it is a turnaround"],a:1,why:"Asset value only protects you if the assets can be sold at carrying value. Leases are liabilities, and stale inventory is worth far less than stated."}]},{id:"6a",unit:6,title:"Second-level thinking",sc:"s12",cards:[{h:"First vs second level",p:"First level: \u201CIt\u2019s a good company, buy it.\u201D Second level: \u201CIt\u2019s a good company, but everyone knows that and the price already assumes perfection, so the expected return is poor.\u201D Marks: you cannot do the same thing as everyone else and expect a different result."},{h:"You must be non-consensus AND right",p:"Being contrarian alone is just being wrong in an unusual direction. The edge comes from holding a view that differs from the crowd for a reason the crowd is ignoring, and being correct about it."},{h:"Price already contains the story",p:"Good news is not the same as good investment. The question is never \u201Cis this a great business?\u201D but \u201Cis it great relative to what the price demands?\u201D"}],quiz:[{type:"mc",q:"Everyone agrees a company will grow 30% a year for a decade, and it trades at 70\xD7 earnings. Second-level view?",options:["Buy \u2014 consensus confirms quality","The consensus is in the price; the return depends on beating it","Short it \u2014 high multiples always fall","Ignore, wait for a crash"],a:1,why:"At 70\xD7 you are not paid for the expected case, only for the case that exceeds expectations. Marks: superior results come from a gap between perception and reality."},{type:"tf",q:"Buying what everybody hates is automatically second-level thinking.",a:!1,why:"Contrarianism without an analytical reason is a coin flip with worse odds."},{type:"mc",q:"Which of these is a genuine second-level question?",options:["Will earnings grow?","Is the chart breaking out?","What is priced in, and what would have to be true for me to be wrong?","What is the analyst target price?"],a:2,why:"Inverting the thesis is the core discipline: state explicitly what would falsify you, before you buy."}]},{id:"6b",unit:6,title:"Risk, cycles and the pendulum",sc:"s1",cards:[{h:"Risk is permanent loss",p:"Not volatility, not tracking error. Risk is the probability that capital does not come back. It is highest exactly when it feels lowest \u2014 when prices have risen for years and everyone has been rewarded for taking more risk."},{h:"The pendulum",p:"Markets swing between euphoria and despair, and they spend very little time at the fair midpoint. You cannot time the swing, but you can know where you are on it and adjust aggressiveness accordingly."},{h:"You can\u2019t predict, you can prepare",p:"Preparation means: cash reserve so you are never a forced seller, no leverage that can be called, position sizes that survive a 50% decline, and a written buy list for when prices collapse. Prepared beats prescient."}],quiz:[{type:"mc",q:"When is risk highest?",options:["After a 40% crash when volatility is extreme","After years of gains when nobody sees a threat","When interest rates rise","During earnings season"],a:1,why:"Risk enters the market through price and complacency. After a crash, prices already embed pessimism \u2014 that is when the risk of permanent loss is often lowest."},{type:"tf",q:"Using margin debt is acceptable if your analysis is sound.",a:!1,why:"Leverage converts a temporary price decline into a permanent loss by forcing you to sell at the worst moment. It removes the one advantage a private long-horizon investor has: the ability to wait."},{type:"mc",q:"Markets fall 35%. You hold 12% cash and a written watchlist. Correct move?",options:["Wait for the exact bottom","Deploy in tranches against your pre-written list","Sell to avoid further losses","Switch entirely to bonds"],a:1,why:"Tranching accepts you cannot pick the bottom while guaranteeing you participate. The pre-written list exists because your judgement is worst under stress."}]},{id:"7a",unit:7,title:"Bernstein\u2019s four pillars",sc:"s5",cards:[{h:"Theory, history, psychology, business",p:"Bernstein: risk and return are joined at the hip; market history rhymes through manias and panics; your own brain is the main adversary; and the finance industry\u2019s interests are not yours. Skip any pillar and the other three will not save you."},{h:"Allocation dominates selection",p:"The split between equities, bonds, cash and property explains far more of your long-run outcome than which stocks you pick. Decide that first, in writing, and let stock picking be the smaller layer on top."},{h:"History as a risk model",p:"Global markets have delivered roughly 6\u20137% real per year over the long run \u2014 with 50%+ drawdowns along the way. Any plan that has not budgeted for a halving is not a plan."}],quiz:[{type:"mc",q:"Which decision most determines your 30-year outcome?",options:["Which individual stocks you own","Your asset allocation and how consistently you keep it","Your entry timing","Your broker"],a:1,why:"Allocation plus behaviour. Selection matters but sits far below these in explanatory power."},{type:"num",q:"A portfolio drops 50%. What return is needed just to get back to even (%)?",a:100,tol:2,unit:"%",why:"Losses are asymmetric: \u221250% needs +100%. This is why avoiding catastrophe outranks capturing every upside."},{type:"tf",q:"Rebalancing forces you to sell what has risen and buy what has fallen.",a:!0,why:"That is its entire value: a mechanical, unemotional contrarian rule with a pre-agreed trigger."}]},{id:"7b",unit:7,title:"Costs, index core, rebalancing",sc:"s11",cards:[{h:"Costs are the only guaranteed return",p:"A 1.5% annual fee compounds against you exactly like a return compounds for you. Over 40 years it can consume a third or more of your final capital. Bernstein\u2019s fourth pillar: the industry is engineered to extract that fee."},{h:"Core and satellite",p:"A practical structure: a low-cost global index core (say 70\u201390%) plus a satellite of individual businesses you have actually researched. The core guarantees you get the market return; the satellite is where your work either pays or teaches you something."},{h:"Swiss specifics",p:"Swiss brokers charge Umsatzabgabe (stamp duty) of roughly 0.075% on domestic and 0.15% on foreign securities; foreign brokers do not. S\xE4ule 3a gives you a tax deduction and is available to you as an apprentice with earned income. Verify current limits before relying on any number."}],quiz:[{type:"num",q:"CHF 100,000 compounding at 7% for 30 years vs 5.5% (after a 1.5% fee). Roughly what percentage of the final value is lost to the fee?",a:35,tol:6,unit:"%",why:"7% \u2192 ~761k; 5.5% \u2192 ~499k. About 34% of the final value goes to fees. This is the strongest argument for a cheap index core."},{type:"mc",q:"Best structure for someone with limited research time and a 30-year horizon?",options:["100% individual stock picks","Global index core with a small researched satellite","Cash until markets fall","Actively managed funds only"],a:1,why:"It guarantees market participation while keeping the upside from your own work \u2014 and it makes your stock-picking record measurable against a real benchmark."},{type:"tf",q:"A fund that beat the market for three years is likely to keep doing so.",a:!1,why:"Short-run outperformance is dominated by luck and factor exposure. Persistence studies find very little skill survives fees."}]},{id:"8a",unit:8,title:"Dividends: the real mechanics",sc:"s4",cards:[{h:"Yield is not income",p:"A dividend is a transfer of value out of the share price, not free money. What creates real income is the underlying earnings growing and the payout being sustainable \u2014 otherwise you are being paid with your own capital."},{h:"The payout ratio test",p:"Dividends \xF7 earnings (better: \xF7 free cash flow). Under ~60% is generally sustainable for a stable business. Above 100% means the dividend is funded by debt or asset sales and a cut is coming, usually alongside a price collapse."},{h:"Yield on cost",p:"Buy at CHF 50 with a CHF 1.50 dividend (3%). If the dividend grows 8% a year, in 15 years it is CHF 4.76 \u2014 a 9.5% yield on your original cost. Dividend growth, not starting yield, builds passive income."}],quiz:[{type:"mc",q:"Stock A yields 9%, payout ratio 130%, falling revenue. Stock B yields 2.5%, payout 40%, dividend growing 10%/yr. Better passive income engine over 20 years?",options:["A \u2014 three times the income today","B \u2014 sustainable and compounding","Equal","A, then switch to B"],a:1,why:"A is very likely to cut, taking the price with it. B\u2019s income overtakes it within roughly a decade and keeps going."},{type:"num",q:"You buy at CHF 50 with a CHF 1.50 annual dividend. It grows 8% a year. What is the dividend after 15 years (CHF)?",a:4.76,tol:.3,unit:"CHF",why:"1.50 \xD7 1.08^15 \u2248 4.76, a 9.5% yield on your original cost. This is the mechanism behind long-term dividend income."},{type:"tf",q:"A very high dividend yield is generally a sign of a bargain.",a:!1,why:"It is usually the market pricing in a cut. Yield rises because the price fell for a reason."}]},{id:"8b",unit:8,title:"Building the income stream (Swiss reality)",cards:[{h:"Total return first",p:"Whether income arrives as a dividend or as a sold slice of an appreciated position is mostly a tax and psychology question. Optimise total return, then choose the withdrawal method \u2014 not the reverse."},{h:"Swiss tax structure",p:"For private investors in Switzerland, capital gains on securities are generally tax-free, while dividends and interest are taxed as income. That asymmetry favours accumulating funds and low-yield compounders over high-yield strategies. Trade too actively and you risk being reclassified as a professional securities dealer, which removes the exemption."},{h:"Withholding and fund domicile",p:"Swiss Verrechnungssteuer of 35% is withheld on Swiss dividends and reclaimed via your tax return. Irish-domiciled ETFs (IE ISIN) typically reduce US withholding to 15% versus 30% for many alternatives. Verify current treaty and fund details \u2014 these rules change."}],quiz:[{type:"mc",q:"As a Swiss private investor with a 30-year horizon, which is structurally most tax-efficient?",options:["High-yield dividend portfolio","Accumulating global index fund plus low-yield compounders","Frequent trading of momentum names","Cash savings account"],a:1,why:"Untaxed capital gains plus deferred dividend drag. High yield converts return into taxable income every single year."},{type:"tf",q:"Very frequent trading can cost a Swiss private investor the capital gains exemption.",a:!0,why:"Professional securities dealer classification considers holding period, volume, leverage and how central trading income is to your livelihood. Get advice before trading heavily \u2014 this app is not tax advice."},{type:"num",q:"You need CHF 3,000/month passive income. At a 3.5% sustainable withdrawal rate, what capital is required (CHF)?",a:1028571,tol:3e4,unit:"CHF",why:"36,000 \xF7 0.035 \u2248 CHF 1.03m. Working backwards from the number is the only way to know whether your savings rate is remotely on track."}]},{id:"9a",unit:9,title:"The power law",sc:"s3",cards:[{h:"Startup returns are not normal",p:"In a typical angel portfolio, roughly half the investments return zero, a third return something modest, and one or two produce the entire return. The mathematics rewards portfolio construction over deal picking."},{h:"Why 20+ cheques",p:"If one in twenty produces a 30\xD7 outcome, holding five investments gives you a real chance of catching none. Angels who put the same total capital into 25 small cheques outperform those who put it into 5 large ones \u2014 same money, far better hit probability."},{h:"Illiquidity is the price",p:"Expect 7\u201312 years to any exit, no ability to sell, no market price, and dilution along the way. Never invest money you might need. As a founder yourself, remember your own human capital is already fully exposed to this asset class."}],quiz:[{type:"mc",q:"You have CHF 50,000 for angel investing. Best structure?",options:["One CHF 50k cheque into your best idea","Five CHF 10k cheques","Twenty CHF 2.5k cheques across sectors and years","Wait until you can write a CHF 200k cheque"],a:2,why:"Power-law maths: you need enough shots to catch the tail. Spreading across vintages also protects you from investing everything at one point in the funding cycle."},{type:"tf",q:"A startup portfolio where 60% of positions go to zero is a failed portfolio.",a:!1,why:"That is the normal shape of a functioning angel portfolio. What matters is whether one position returned 20\xD7 or more."},{type:"mc",q:"Biggest risk of investing in a friend\u2019s startup?",options:["The valuation","That you cannot assess it objectively and cannot exit the relationship","Legal fees","Dilution"],a:1,why:"Every angel loss is survivable; a destroyed friendship plus a loss is not. If you do it, size it as money you have written off on day one."}]},{id:"9b",unit:9,title:"Dilution, SAFEs and signals",sc:"s8",cards:[{h:"Dilution maths",p:"Your percentage falls at every round. Own 10% and the company issues 20% of new shares? You now own 8%. Across four rounds you may end at a third of your starting stake \u2014 which is fine if the value per point rose more than your share fell."},{h:"SAFEs and convertibles",p:"You lend value now and convert to equity at the next priced round. Two terms matter: the valuation cap (the maximum valuation at which you convert) and the discount (typically 15\u201325%). No cap means you can fund a company and receive almost nothing if it raises at a huge valuation."},{h:"Signals worth paying for",p:"Founders with domain scars, real customer revenue rather than letters of intent, a market that already spends money on the problem, tight cap table, and founders who take a low salary. Signals worth ignoring: press coverage, accelerator badges, a slick deck."}],quiz:[{type:"num",q:"You own 10%. The company issues new shares equal to 20% of the post-round cap table. What do you own after (%)?",a:8,tol:.2,unit:"%",why:"10% \xD7 (1 \u2212 0.20) = 8%. Every round applies this multiplicatively."},{type:"mc",q:"You invest CHF 25,000 on a SAFE with a CHF 5m cap and 20% discount. The next round prices at CHF 20m. What happens?",options:["You convert at CHF 20m","You convert at CHF 16m (the discount)","You convert at the CHF 5m cap \u2014 the better term for you","The SAFE expires"],a:2,why:"You get the more favourable of cap and discount. The cap converts your 25k as if the company were worth 5m \u2014 a 4\xD7 better position than converting at the round price."},{type:"tf",q:"A startup with heavy press coverage and no paying customers is a strong signal.",a:!1,why:"Press is a marketing output, not evidence of demand. Revenue from strangers is the only signal that is hard to fake."}]},{id:"10a",unit:10,title:"Conviction, concentration, patience",sc:"s7",cards:[{h:"Concentration cuts both ways",p:"Estebaranz argues that meaningful outperformance comes from a concentrated book of deeply researched ideas \u2014 but concentration multiplies the cost of being wrong. The honest rule: concentrate only in proportion to the work you have actually done, and only with money you cannot be forced to sell."},{h:"The three reasons to sell",p:"One: the thesis is broken. Two: the price now exceeds any reasonable value. Three: you found something clearly better and capital is limited. \u201CIt went down\u201D and \u201Cit went up\u201D are not on the list."},{h:"Time arbitrage",p:"Your structural edge over professionals is that nobody can fire you for a bad quarter. Institutions are forced to be short-term; you are not. That patience is the only edge you have that cannot be competed away."}],quiz:[{type:"mc",q:"Your best-researched position has grown to 35% of your portfolio. Thesis intact, valuation still reasonable. Action?",options:["Trim to 5% immediately","Hold, but define in writing the maximum loss you can absorb","Add more with borrowed money","Sell half to lock in gains"],a:1,why:"Neither dogma works. The discipline is to size by conviction AND by survivability: if a 60% decline in that one name would end your plan, it is too big regardless of conviction."},{type:"mc",q:"Which is a valid reason to sell?",options:["The stock fell 25%","A better opportunity exists and capital is limited","It has been flat for two years","A famous investor sold"],a:1,why:"Opportunity cost is the only price-independent reason on the list. The other three are noise or impatience."},{type:"tf",q:"Being unable to be fired for underperformance is a genuine structural edge for a private investor.",a:!0,why:"Time arbitrage. Most professional capital cannot hold through a three-year drawdown; you can, which is why cheap and unloved is available to you at all."}]}],fte=[{id:"s1",title:"The 34% drawdown",tag:"Marks \xB7 Graham",setup:"A global recession hits. Your portfolio is down 34% in four months. Every headline says this is different. Your holdings are still profitable, still growing, and now trade at half their earnings multiple from last year. You have 10% cash and a 25-year horizon.",options:[{t:"Sell everything and wait for clarity",s:-3,f:"Clarity arrives only after prices have recovered. Selling here converts a temporary quote decline into a permanent loss and puts you in the position of having to be right twice."},{t:"Do nothing at all",s:1,f:"Not a mistake. But you are wasting the only thing a bear market gives you \u2014 prices below value \u2014 while holding cash you set aside for exactly this."},{t:"Deploy the cash in three tranches over the next months against a pre-written list",s:3,f:"Correct. You accept you cannot pick the bottom while guaranteeing participation. Marks: you can\u2019t predict, you can prepare. The pre-written list bypasses your worst instincts under stress."},{t:"Borrow on margin \u2014 this is a generational opportunity",s:-3,f:"Leverage is how good analysis produces bankruptcy. A further 30% decline forces you to sell at the exact bottom. Never surrender the ability to wait."}]},{id:"s2",title:"Earnings miss",tag:"Lynch \xB7 Graham",setup:"A stalwart you own misses quarterly earnings by 8% and drops 22% in a day. Reading the report: the miss came from a one-off currency effect and a factory upgrade. Volumes grew, market share grew, the balance sheet is unchanged.",options:[{t:"Sell \u2014 the market has spoken",s:-2,f:"You outsourced your judgement to a one-day price move. Mr. Market is a servant, not an oracle."},{t:"Re-check the thesis; if intact, add to the position",s:3,f:"Correct sequence: verify first, then act. Volumes and share growing while the multiple compresses is the definition of Mr. Market offering you a discount."},{t:"Hold and add nothing",s:1,f:"Defensible, but if your work says the business is unchanged and the price is 22% lower, doing nothing means you did not believe your own analysis."},{t:"Set a stop-loss 10% lower to protect yourself",s:-2,f:"Stop-losses guarantee you sell into panic. They are a trading tool applied to an investing horizon."}]},{id:"s3",title:"The friend\u2019s round",tag:"Angel \xB7 Housel",setup:"A friend is raising CHF 300,000 at a CHF 4m valuation for a hardware startup. Twelve months in, an unfinished prototype, no revenue, two paying pilot letters of intent. He asks you for CHF 15,000 \u2014 which is 60% of your liquid savings.",options:[{t:"Invest the full CHF 15,000 \u2014 you believe in him",s:-3,f:"Sixty percent of liquid savings into a pre-revenue single position violates both power-law maths and basic survival. Belief in a person is not a portfolio strategy."},{t:"Invest CHF 2,000, sized as money already written off",s:2,f:"Sensible. Small enough to preserve both your capital base and the friendship. Consider whether you can even assess this objectively \u2014 you probably cannot."},{t:"Decline, explain honestly, offer help instead of cash",s:3,f:"The strongest answer at your capital level. Letters of intent are not revenue, and one cheque this size cannot work in a power-law asset class. Time and introductions cost you nothing and are often worth more."},{t:"Invest CHF 15,000 but demand a board seat",s:-2,f:"Governance does not fix position sizing, and a board seat on a pre-revenue startup mostly buys you an obligation."}]},{id:"s4",title:"Dividend cut warning",tag:"Income mechanics",setup:"A holding yields 8.4%. Payout ratio is 118% of free cash flow, net debt has risen for three straight years, revenue is flat, and management has publicly promised the dividend is safe.",options:[{t:"Buy more \u2014 8.4% locked in",s:-3,f:"The yield is high because the market is pricing the cut. Payout above 100% of free cash flow means the dividend is funded by debt."},{t:"Sell \u2014 the dividend is being funded by borrowing",s:3,f:"Correct. When the cut comes, you lose the income and roughly 20\u201340% of the price simultaneously. The cash flow statement outranks management reassurance every time."},{t:"Hold and collect the dividend until it is cut",s:-1,f:"You are being paid with your own capital while waiting for a predictable repricing."},{t:"Hold but stop reinvesting the dividend",s:0,f:"Half a decision. You have identified the risk and then chosen not to act on it."}]},{id:"s5",title:"The mania",tag:"Bernstein \xB7 Marks",setup:"A sector has risen 300% in 18 months. Colleagues at work compare gains daily. Valuations are 60\xD7 sales. You own none of it and have underperformed for a year. Your own boring portfolio is up 6%.",options:[{t:"Buy a small speculative position so you stop feeling left out",s:-2,f:"The stated reason is envy, which is the fourth pillar (psychology) failing. A position taken for emotional reasons will be sold for emotional reasons."},{t:"Keep to your written allocation and rebalance as normal",s:3,f:"Correct. Bernstein\u2019s history pillar exists precisely for this moment. Underperforming a mania is the price of not participating in its unwind."},{t:"Short the sector",s:-3,f:"Manias last far longer than your solvency. Being right about valuation and wrong about timing is indistinguishable from being wrong."},{t:"Sell your portfolio and rotate fully into the sector",s:-3,f:"Buying peak enthusiasm with everything you own is the textbook mechanism of permanent loss."}]},{id:"s6",title:"The cheap retailer",tag:"Value trap",setup:"A retail chain trades at 0.4\xD7 book and a P/E of 5. Same-store sales have fallen for nine consecutive quarters, online competitors are taking share, book value is mostly ageing stores on 15-year leases, and net debt is 4\xD7 EBITDA.",options:[{t:"Buy \u2014 60% below book value is a huge margin of safety",s:-3,f:"Book value only protects you if it is realisable. Leased stores and stale inventory are not worth carrying value, and the debt removes any ability to wait."},{t:"Avoid \u2014 deteriorating earnings plus leverage is a trap, not a discount",s:3,f:"Correct. The multiple falls as fast as the earnings, so the discount never closes. Graham\u2019s safety needs an asset floor or stable earning power; here there is neither."},{t:"Buy a small position as a lottery ticket",s:-1,f:"Deliberate speculation is at least honest, but leverage plus secular decline gives you a lottery ticket with negative expected value."},{t:"Wait for a catalyst \u2014 new management or a debt restructuring",s:2,f:"Reasonable discipline. Turnarounds require something to actually change; waiting for the catalyst costs you the first 20% and saves you the previous 60%."}]},{id:"s7",title:"Position size problem",tag:"Estebaranz \xB7 risk",setup:"Your highest-conviction stock has risen 5\xD7 and is now 38% of your portfolio. The thesis is intact, growth is accelerating, but the multiple has expanded from 14\xD7 to 41\xD7 earnings. This portfolio is also your emergency reserve.",options:[{t:"Hold everything \u2014 never interrupt compounding",s:0,f:"Defensible for a pure long-horizon book, but you just said this money is also your emergency reserve. Conviction does not pay rent during a 60% drawdown."},{t:"Trim to around 20\u201325% and hold the rest",s:3,f:"Correct balance. You keep the tail exposure that drives returns while ensuring one repricing cannot end your plan. Size by conviction AND by survivability."},{t:"Sell it all and lock in the gain",s:-1,f:"You would be selling a working business for the reason that it worked. Not one of the three valid sell reasons."},{t:"Add more \u2014 winners keep winning",s:-2,f:"Adding to a 38% position at 41\xD7 earnings with no separate reserve is how a single bad quarter resets a decade."}]},{id:"s8",title:"The follow-on",tag:"Angel \xB7 sunk cost",setup:"A startup you backed 18 months ago at CHF 4m is raising at CHF 16m. Revenue grew from zero to CHF 90k ARR, churn is high, the lead investor is the founder\u2019s uncle, and two of four engineers left. You have pro-rata rights: CHF 8,000 to keep your stake.",options:[{t:"Exercise pro-rata \u2014 protect your ownership",s:-2,f:"Ownership percentage is not the goal; expected value is. High churn, insider-led pricing and engineering departures at a 4\xD7 markup means you are paying more for a weaker company."},{t:"Pass, and treat the original cheque as sunk",s:3,f:"Correct. Follow-ons should be earned by evidence, not by loyalty to your earlier decision. The valuation quadrupled while the fundamentals deteriorated."},{t:"Double your pro-rata to signal support",s:-3,f:"Averaging up into deteriorating fundamentals with no independent price discovery."},{t:"Pass but ask for updated cohort and churn data first",s:2,f:"Good instinct \u2014 always ask. But the answer here is already visible in the departures and the insider-led round."}]},{id:"s9",title:"The windfall",tag:"Housel \xB7 Bernstein",setup:"You receive CHF 40,000 unexpectedly. Markets are near all-time highs. You have no debt, three months of expenses in cash, and a 25-year horizon.",options:[{t:"Invest it all immediately into your target allocation",s:2,f:"Statistically the highest expected value \u2014 markets rise more often than they fall, so time in beats timing. The risk is behavioural: a 25% drop next month could break your discipline."},{t:"Split across 6\u201312 months into the target allocation",s:3,f:"Slightly lower expected return, meaningfully higher probability that you actually stay invested. For a first large sum, the behavioural insurance is worth the small cost."},{t:"Hold cash until markets correct",s:-2,f:"All-time highs are the normal state of a rising market. Waiting for a correction has historically cost more than the corrections themselves."},{t:"Put it into the highest-yielding stocks you can find",s:-2,f:"Reaching for yield with a windfall is how people end up owning the most fragile balance sheets in the market."}]},{id:"s10",title:"The acquisition",tag:"Lynch \xB7 capital allocation",setup:"A profitable niche software company you own announces it is buying a chain of fitness studios for 40% of its market cap, funded with new debt. Management calls it a diversification into consumer wellness.",options:[{t:"Hold \u2014 management knows the business better than you",s:-1,f:"Management knows the operations. Capital allocation is a separate skill, and this is the pattern Lynch named diworsification."},{t:"Sell \u2014 the capital allocation thesis is broken",s:3,f:"Correct. Your thesis was a focused high-return software business. It just became a levered conglomerate with no synergy. That is a broken thesis, which is reason one to sell."},{t:"Buy more on the dip",s:-3,f:"You would be adding to a company that just told you it has run out of high-return ideas in its core."},{t:"Hold and watch the integration for two quarters",s:0,f:"You will learn something, but you are holding through the period when the thesis is most likely to keep degrading."}]},{id:"s11",title:"Index envy",tag:"Bernstein \xB7 honesty",setup:"Three years into stock picking, your researched portfolio has returned 5.1% per year. The global index returned 9.4%. You spend roughly six hours a week on research.",options:[{t:"Try harder \u2014 increase research hours",s:-1,f:"More effort on an unmeasured process just produces more confident errors. First find out where the gap came from."},{t:"Attribute the gap honestly, then move the core to an index and keep a small satellite",s:3,f:"Correct. Three years is short, but the discipline of benchmarking yourself and acting on the answer is rarer and more valuable than the outperformance itself."},{t:"Ignore it \u2014 value investing works over decades",s:0,f:"True, and also the sentence every underperforming investor tells themselves indefinitely. It is only valid if you can name what you got right and wrong."},{t:"Switch to a more aggressive strategy to catch up",s:-3,f:"Increasing risk to recover past underperformance is the mechanism behind most blow-ups."}]},{id:"s12",title:"The hot IPO",tag:"Marks \xB7 second level",setup:"A company you genuinely admire is going public. It grows 45% a year, is loss-making, and prices at 22\xD7 sales. Allocation is heavily oversubscribed. Everyone you know is applying.",options:[{t:"Apply for the maximum allocation",s:-2,f:"IPOs are sold, not bought \u2014 the seller has better information and picks the timing. Oversubscription is a fact about enthusiasm, not about value."},{t:"Skip it, add to the watchlist, and revisit after two or three reporting cycles",s:3,f:"Correct. Lock-up expiries and the first earnings misses often reprice these dramatically. You lose nothing by requiring public numbers before you underwrite them."},{t:"Buy on the first day of trading",s:-2,f:"You are buying the moment sentiment is at its structural maximum."},{t:"Buy a token amount to learn from it",s:0,f:"Paying tuition is legitimate, but the lesson here is available for free by watching."}]}],Fn=[{t:"VWRL",n:"FTSE All-World ETF",sec:"Index fund",cat:"Index",p0:128,eps:6.4,g:.07,dy:.017,moat:3,vol:.032,note:"The benchmark. Owning it is the default that your stock picking must beat."},{t:"KO",n:"Coca-Cola",sec:"Consumer staples",cat:"Stalwart",p0:71,eps:2.95,g:.05,dy:.029,moat:5,vol:.038,note:"Buffettology archetype: brand, distribution, pricing power, low capital needs."},{t:"NESN",n:"Nestl\xE9",sec:"Consumer staples",cat:"Stalwart",p0:82,eps:4.6,g:.04,dy:.035,moat:4,vol:.036,note:"Swiss stalwart. Slow, defensive, dividend-driven total return."},{t:"ROG",n:"Roche",sec:"Healthcare",cat:"Stalwart",p0:268,eps:17.5,g:.04,dy:.037,moat:4,vol:.042,note:"Paten
