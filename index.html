<html lang="en">
<head>

<style>*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0A1017; }
body { -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; background: none; border: none; padding: 0; color: inherit; }
button:disabled { cursor: default; }
input { font: inherit; }
:focus-visible { outline: 2px solid #D6A64A; outline-offset: 2px; }

.flex { display: flex; }
.grid { display: grid; }
.grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.flex-1 { flex: 1 1 0%; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.items-end { align-items: flex-end; }
.items-baseline { align-items: baseline; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.gap-1 { gap: .25rem; }
.gap-2 { gap: .5rem; }
.gap-3 { gap: .75rem; }

.w-full { width: 100%; }
.w-24 { width: 6rem; }
.w-40 { width: 10rem; }
.max-w-lg { max-width: 32rem; }
.mx-auto { margin-left: auto; margin-right: auto; }
.h-1 { height: .25rem; }
.h-1\.5 { height: .375rem; }

.p-3 { padding: .75rem; } .p-4 { padding: 1rem; } .p-5 { padding: 1.25rem; }
.px-1 { padding-left: .25rem; padding-right: .25rem; }
.px-2 { padding-left: .5rem; padding-right: .5rem; }
.px-3 { padding-left: .75rem; padding-right: .75rem; }
.px-4 { padding-left: 1rem; padding-right: 1rem; }
.py-1 { padding-top: .25rem; padding-bottom: .25rem; }
.py-1\.5 { padding-top: .375rem; padding-bottom: .375rem; }
.py-2 { padding-top: .5rem; padding-bottom: .5rem; }
.py-3 { padding-top: .75rem; padding-bottom: .75rem; }
.pt-3 { padding-top: .75rem; } .pt-5 { padding-top: 1.25rem; }
.pb-28 { padding-bottom: 7rem; }
.mb-1 { margin-bottom: .25rem; } .mb-2 { margin-bottom: .5rem; }
.mb-3 { margin-bottom: .75rem; } .mb-4 { margin-bottom: 1rem; } .mb-5 { margin-bottom: 1.25rem; }
.mt-1 { margin-top: .25rem; } .mt-2 { margin-top: .5rem; }
.mt-3 { margin-top: .75rem; } .mt-4 { margin-top: 1rem; }

.rounded { border-radius: .25rem; }
.rounded-md { border-radius: .375rem; }
.rounded-lg { border-radius: .5rem; }
.rounded-full { border-radius: 9999px; }
.rounded-t-2xl { border-top-left-radius: 1rem; border-top-right-radius: 1rem; }

.text-left { text-align: left; }
.text-right { text-align: right; }
.text-xs { font-size: .75rem; line-height: 1rem; }
.text-sm { font-size: .875rem; line-height: 1.25rem; }
.uppercase { text-transform: uppercase; }
.tracking-widest { letter-spacing: .1em; }
.whitespace-nowrap { white-space: nowrap; }

.fixed { position: fixed; }
.inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
.bottom-0 { bottom: 0; } .left-0 { left: 0; } .right-0 { right: 0; }
.z-50 { z-index: 50; }
.overflow-x-auto { overflow-x: auto; }
.overflow-y-auto { overflow-y: auto; }
.outline-none { outline: none; }
.opacity-40 { opacity: .4; }
.transition-opacity { transition: opacity .15s ease; }
.hover\:opacity-80:hover { opacity: .8; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* iOS standalone tuning */
html { background: #0A1017; height: 100%; }
body {
  min-height: 100%;
  overscroll-behavior-y: none;          /* no rubber-band white flash */
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;       /* stop Safari inflating type in landscape */
}
input, button { -webkit-appearance: none; border-radius: 0; }
input { border-radius: .375rem; }

 are paying for growth that has to actually arrive."},"book value":{t:"Book value",d:"What the company owns minus what it owes, according to its accounts. Roughly, what would theoretically be left for shareholders if it sold everything and paid off all debts.",f:"Book value = total assets \u2212 total liabilities",ex:"Assets CHF 800m, debts CHF 500m \u2192 book value CHF 300m.",w:"It is a rough floor for asset-heavy businesses. It is nearly meaningless for software companies, whose real assets are code and people that never appear on the balance sheet."},"book value per share":{t:"Book value per share",d:"The book value divided by the number of shares \u2014 the accounting value behind one share.",f:"Book value per share = book value \xF7 number of shares",ex:"Book value CHF 300m, 15m shares \u2192 CHF 20 per share."},"P/B":{t:"P/B ratio (price to book)",d:"How much you pay relative to the accounting value of the company's assets.",f:"P/B = share price \xF7 book value per share",ex:"Price CHF 30, book value per share CHF 20 \u2192 P/B of 1.5.",w:"Below 1 means the market values the company at less than its stated assets \u2014 sometimes a bargain, more often a warning that those assets are not worth what the accounts claim."},ROE:{t:"ROE (return on equity)",d:"How much profit the company generates from the shareholders' money it holds. It measures how good the business is at turning capital into profit.",f:"ROE = net profit \xF7 shareholders' equity",ex:"Profit CHF 60m on equity of CHF 300m \u2192 ROE of 20%.",w:"Buffett looks for ROE consistently above 15% without much debt. High ROE year after year is evidence of a real competitive advantage rather than luck."},moat:{t:"Moat",d:"A durable advantage that stops competitors from stealing a company's profits \u2014 a brand people insist on, a network that gets better as it grows, or costs that make switching painful.",ex:"Leaving a bank means moving direct debits, cards and salary payments. That friction is a moat. A steel mill has none: buyers pick whoever is cheapest today.",w:"Without a moat, competition grinds profits down to nothing. It is the single thing that lets a business stay profitable for decades."},"margin of safety":{t:"Margin of safety",d:"Buying well below what you think something is worth, so that being wrong still doesn't ruin you.",f:"Margin of safety = (your value estimate \u2212 price) \xF7 your value estimate",ex:"You think it's worth CHF 100 and pay CHF 62 \u2192 a 38% margin of safety. Even if your estimate was 25% too optimistic, you still didn't overpay.",w:"Graham's central idea. It exists precisely because your forecast will sometimes be wrong."},"discount to value":{t:"Discount to value",d:"How far below your own estimate of a company's worth you are buying. It is the same idea as margin of safety, expressed as one percentage.",f:"Discount = (your value estimate \u2212 price) \xF7 your value estimate",ex:"You judge it worth CHF 100 and the price is CHF 62 \u2192 (100 \u2212 62) \xF7 100 = 38% discount. Note the upside is larger than the discount: 100 \xF7 62 \u2212 1 = 61% gain if price reaches value.",w:"It is your error budget. A 38% discount means your valuation could be 38% too optimistic and you still haven't overpaid. Demand a bigger discount when your estimate is shakier."},"intrinsic value":{t:"Intrinsic value",d:"What a business is genuinely worth based on the cash it will produce over its life \u2014 as opposed to what the market happens to be quoting today.",w:"Nobody can calculate it exactly. The point is to arrive at a rough range and then only buy well below it."},DCF:{t:"DCF (discounted cash flow)",d:"A method of valuing a business by estimating the cash it will produce in future years, then reducing those future amounts to what they're worth today.",f:"Value = sum of (future cash flow \xF7 (1 + discount rate)^years)",ex:"CHF 100 arriving in 5 years, with a 10% required return, is worth 100 \xF7 1.1\u2075 = about CHF 62 today.",w:"It forces you to write down your assumptions. Its weakness is that small changes in those assumptions swing the answer enormously."},"discount rate":{t:"Discount rate",d:"The annual return you demand for taking the risk. It converts future money into today's money.",ex:"If you want 10% a year, then CHF 110 next year is worth CHF 100 to you today.",w:"For a private investor the practical version is: 'I want 10% a year \u2014 what is the most I can pay?' A higher discount rate means you'll pay less."},WACC:{t:"WACC (weighted average cost of capital)",d:"The blended annual cost of the money a company uses, mixing what it pays lenders and what shareholders expect.",w:"Professionals use it as the discount rate. As a private investor you can skip it and simply use the return you personally require."},"terminal value":{t:"Terminal value",d:"In a valuation, the estimated worth of everything beyond the years you actually forecast \u2014 usually year 10 onwards.",w:"It often makes up 60\u201380% of the total answer, and it is the least knowable part. When someone's valuation looks precise, this is usually where the guesswork hides."},"free cash flow":{t:"Free cash flow",d:"The cash left over after the company has paid all its running costs and the investment needed to keep operating.",f:"Free cash flow = operating cash flow \u2212 capital expenditure",w:"Profit is an accounting opinion; cash is a fact. Dividends and debt repayments come out of cash, not out of reported profit."},"owner earnings":{t:"Owner earnings",d:"Buffett's version of true profit: what the owner could actually take out each year without the business shrinking.",f:"Owner earnings = net profit + depreciation \u2212 maintenance capex \xB1 working capital change",ex:"Profit 120, depreciation 40, maintenance capex 55, working capital up 10 \u2192 120 + 40 \u2212 55 \u2212 10 = 95.",w:"Reported profit often overstates what you can really pocket, especially in businesses that constantly need new machines."},capex:{t:"Capex (capital expenditure)",d:"Money spent on physical or long-lived things: machines, buildings, vehicles, equipment.",w:"A business needing heavy capex just to stand still keeps very little for its owners. Low-capex businesses compound far faster."},"maintenance capex":{t:"Maintenance capex",d:"The portion of capex needed just to keep the business at its current size \u2014 replacing worn-out equipment.",w:"This is a real cost of staying in business, so it must be subtracted from profit. Growth capex, which expands the business, is optional and treated separately."},"D&A":{t:"D&A (depreciation & amortisation)",d:"An accounting charge that spreads the cost of an asset over the years it is used, rather than all at once.",ex:"A CHF 100,000 machine lasting 10 years shows CHF 10,000 of depreciation each year, even though the cash left the company in year one.",w:"It reduces reported profit without any cash leaving that year, which is why you add it back when calculating owner earnings."},"working capital":{t:"Working capital",d:"The cash tied up in day-to-day operations \u2014 money sitting in unsold stock and in bills customers haven't paid yet.",w:"Growing companies swallow cash here. If it rises much faster than sales, customers may not be paying, which is a classic warning sign."},"net income":{t:"Net income",d:"The official bottom-line profit after every cost, interest and tax. Also called net profit or earnings.",w:"It is the starting point for most calculations, but it can be shaped by accounting choices. Always cross-check it against actual cash."},EBITDA:{t:"EBITDA",d:"Profit before interest, tax, depreciation and amortisation \u2014 an approximation of operating profit before financing and accounting effects.",w:"Useful for comparing companies with different debt levels, but it deliberately ignores real costs. Munger called it 'bullshit earnings' for exactly that reason."},"net debt":{t:"Net debt",d:"Total borrowings minus the cash the company holds.",f:"Net debt = total debt \u2212 cash",ex:"Debt CHF 500m, cash CHF 200m \u2192 net debt CHF 300m. A company with more cash than debt has 'net cash', which is a position of strength.",w:"Debt removes your ability to wait. A cheap company with heavy debt can go bankrupt before its value is recognised."},"net debt/EBITDA":{t:"Net debt / EBITDA (leverage ratio)",d:"How many years of rough operating profit it would take to repay everything a company owes. The standard test of whether a debt load is dangerous.",f:"Leverage = net debt \xF7 EBITDA",ex:"Net debt CHF 400m against EBITDA of CHF 100m \u2192 4\xD7. Four full years of operating profit, spent on nothing else at all, just to clear the borrowings.",w:"Under 2\xD7 is comfortable, 3\xD7 is stretched, above 4\xD7 the lenders effectively control the company. On a business with falling sales it is close to fatal: profits shrink, so the ratio worsens by itself, and the bank can refuse to refinance at the worst moment."},"return on capital":{t:"Return on capital",d:"How much profit a business earns on every franc put to work in it, counting both the owners' money and the borrowed money. Unlike ROE, it cannot be inflated by taking on debt.",f:"Return on capital = operating profit \xF7 (equity + debt)",ex:"CHF 45 of profit from CHF 400 of total capital \u2192 11%. A rival earning CHF 22 on CHF 100 of equity with no debt earns 22% \u2014 twice as good, even if its ROE looks lower on paper.",w:"It is the honest version of ROE. When a company's ROE is high but its return on capital is ordinary, the difference was borrowed."},leverage:{t:"Leverage",d:"Using borrowed money to increase the size of a position \u2014 whether by a company or by an investor.",w:"It magnifies gains and losses equally, but only losses can force you to sell at the worst possible moment. It is the main reason clever investors go broke."},"debt/equity":{t:"Debt-to-equity ratio",d:"How much a company has borrowed compared with the shareholders' money in it.",f:"Debt/equity = total debt \xF7 shareholders' equity",ex:"Debt CHF 600m against equity of CHF 300m \u2192 2.0, meaning twice as much borrowed as owned.",w:"Above roughly 1 deserves scrutiny; high ratios can make return on equity look impressive while quietly making the company fragile."},dividend:{t:"Dividend",d:"A cash payment made from the company's profits to shareholders, usually quarterly or annually.",w:"It is not free money \u2014 the share price drops by roughly the payment amount. Real income comes from the dividend growing over time."},"dividend yield":{t:"Dividend yield",d:"The annual dividend as a percentage of the share price.",f:"Dividend yield = annual dividend per share \xF7 share price",ex:"CHF 1.50 dividend on a CHF 50 share \u2192 3%.",w:"A very high yield is usually a warning, not a bargain: the yield rose because the price collapsed, and a cut is often coming."},"payout ratio":{t:"Payout ratio",d:"The share of profit that gets paid out as dividends instead of being kept in the business.",f:"Payout ratio = dividends \xF7 profit (better: \xF7 free cash flow)",ex:"CHF 2 of dividends from CHF 5 of profit \u2192 40%.",w:"Below about 60% is generally safe. Above 100% means the company is paying dividends with borrowed money, and the dividend will eventually be cut."},"yield on cost":{t:"Yield on cost",d:"Today's dividend measured against the price you originally paid, not today's price.",ex:"You bought at CHF 50 with a CHF 1.50 dividend (3%). Fifteen years later the dividend is CHF 4.76 \u2014 a 9.5% yield on your original CHF 50.",w:"This is the actual mechanism behind long-term passive income. Dividend growth matters far more than the starting yield."},"total return":{t:"Total return",d:"Everything you earn from an investment: the price change plus dividends received.",w:"Judging an investment on price alone ignores years of dividends; judging on dividends alone ignores the capital you lost."},CAGR:{t:"CAGR (compound annual growth rate)",d:"The smoothed average yearly rate that turns a starting amount into an ending amount.",f:"CAGR = (end \xF7 start)^(1 \xF7 years) \u2212 1",ex:"CHF 10,000 becomes CHF 20,000 in 8 years \u2192 (2)^(1/8) \u2212 1 = about 9% a year.",w:"It is the only fair way to compare results over different time periods."},compounding:{t:"Compounding",d:"Earning returns on your previous returns, so growth accelerates over time.",ex:"CHF 10,000 at 8%: after year 1 you have CHF 10,800, and year 2 earns 8% on 10,800, not on 10,000. After 30 years it's roughly CHF 100,000.",w:"It is why starting at 18 is worth more than any stock-picking skill you might develop later. Time is the ingredient you can't buy back."},"rule of 72":{t:"Rule of 72",d:"A mental shortcut for how long money takes to double.",f:"Years to double \u2248 72 \xF7 annual return %",ex:"At 9% a year: 72 \xF7 9 = 8 years to double.",w:"It's the fastest sanity check there is. If someone promises doubling in 2 years, they are implying 36% a year \u2014 ask hard questions."},drawdown:{t:"Drawdown",d:"The fall from a peak to the bottom, expressed as a percentage.",ex:"A portfolio falling from CHF 100,000 to CHF 60,000 has a 40% drawdown.",w:"Losses are asymmetric: recovering from \u221250% requires +100%. Avoiding disaster matters more than catching every gain."},volatility:{t:"Volatility",d:"How much a price jumps around, up and down.",w:"Volatility is not the same as risk. A jumpy share in a debt-free company is far safer than a calm one loaded with borrowings. Marks: risk is losing money permanently, not seeing red numbers temporarily."},risk:{t:"Risk",d:"In value investing, the chance of permanently losing your capital \u2014 not the chance of a temporary price fall.",w:"Risk is highest exactly when it feels lowest: after years of gains, when everyone has been rewarded for taking more of it."},diversification:{t:"Diversification",d:"Spreading money across different investments so that one bad outcome can't destroy you.",w:"The cheapest protection available against your own mistakes. The cost is that you'll never own only the best performer."},"asset allocation":{t:"Asset allocation",d:"How you split your money between broad categories: shares, bonds, cash, property.",w:"Bernstein's point: this single decision explains more of your 30-year outcome than which individual shares you pick."},rebalancing:{t:"Rebalancing",d:"Periodically returning your portfolio to its target split by selling what has grown and buying what has fallen.",ex:"Target is 80% shares. After a strong year it's 88%, so you sell 8% and move it to the other side.",w:"It's a mechanical way of selling high and buying low, with the decision made in advance \u2014 before emotion can interfere."},"index fund":{t:"Index fund",d:"A fund that simply owns everything in a market, in proportion, instead of trying to pick winners.",w:"It guarantees you the market's return minus a tiny fee. Most professionals fail to beat it, which makes it the honest benchmark for your own results."},ETF:{t:"ETF (exchange-traded fund)",d:"A fund you buy and sell on the stock exchange exactly like a share. Most index funds you'd buy are ETFs.",w:"Cheap, instantly diversified, and available at every Swiss broker. For most people it's the sensible core of a portfolio."},accumulating:{t:"Accumulating vs distributing fund",d:"An accumulating fund reinvests dividends inside the fund automatically. A distributing fund pays them into your account as cash.",w:"In Switzerland, dividends are taxed as income whether reinvested or not, so accumulating funds don't dodge the tax \u2014 but they do compound automatically without you having to act."},TER:{t:"TER (total expense ratio)",d:"The annual fee a fund charges, as a percentage of your money invested.",ex:"A 0.20% TER on CHF 10,000 costs CHF 20 a year. A 1.5% fee costs CHF 150.",w:"Fees compound against you just as returns compound for you. Over 30 years, 1.5% a year can consume roughly a third of your final capital."},"stamp duty":{t:"Stamp duty (Umsatzabgabe)",d:"A small Swiss tax charged on securities transactions by Swiss brokers \u2014 roughly 0.075% on Swiss and 0.15% on foreign securities.",w:"Small per trade, but it's one more reason frequent trading loses to patience. Verify current rates, as they can change."},"withholding tax":{t:"Withholding tax (Verrechnungssteuer)",d:"Tax deducted at source from dividends before the money reaches you. In Switzerland it's 35% on Swiss dividends.",w:"For Swiss residents it's reclaimable through your tax return, provided you declare the holding. Foreign dividends have their own rates set by treaty."},"S\xE4ule 3a":{t:"S\xE4ule 3a (pillar 3a)",d:"Switzerland's tax-privileged private pension account. Contributions are deducted from your taxable income, and the money is locked until near retirement.",w:"Available to you as an apprentice with earned income. A 3a account invested in shares beats a 3a savings account over long horizons. Check the current annual limit \u2014 it changes."},"capital gains":{t:"Capital gains",d:"The profit made when you sell something for more than you paid.",w:"For private investors in Switzerland these are generally tax-free on securities, while dividends are taxed as income. That asymmetry quietly favours low-yield compounders over high-yield strategies."},"professional securities dealer":{t:"Professional securities dealer status",d:"A Swiss tax classification. If your trading looks like a business rather than private investing, the authorities can reclassify you \u2014 and your capital gains become taxable.",w:"Factors include how long you hold, how often you trade, whether you use borrowed money, and how much of your income it represents. Another argument for patience. Get proper advice before trading heavily."},cyclical:{t:"Cyclical",d:"A company whose profits rise and fall with the wider economy \u2014 carmakers, banks, steel, airlines, chemicals.",w:"The rules invert here: a low P/E usually means profits are at a peak and about to fall, while a scary-looking high P/E can mark the bottom. Misreading this is a common expensive mistake."},stalwart:{t:"Stalwart",d:"Lynch's term for a large, stable company growing perhaps 4\u201312% a year \u2014 think Nestl\xE9 or Coca-Cola.",w:"Expect solid gains over years plus dividends, not spectacular ones. These cushion a portfolio during declines."},"fast grower":{t:"Fast grower",d:"A smaller, aggressive company growing 20%+ a year.",w:"This is where Lynch found his tenbaggers, and also where the biggest losses happen. Size these positions so a failure doesn't hurt too much."},turnaround:{t:"Turnaround",d:"A damaged company that might recover \u2014 if something actually changes.",w:"Hope is not a catalyst. You need new management, a sold-off division, a fixed balance sheet \u2014 something concrete."},"asset play":{t:"Asset play",d:"A company sitting on something worth more than its share price suggests \u2014 land, a stake in another business, cash.",w:"Only works if that hidden value can actually be sold or unlocked. Otherwise it stays hidden forever."},"value trap":{t:"Value trap",d:"A share that looks cheap on the numbers but keeps falling, because the underlying business is genuinely dying.",ex:"Newspapers, video rental shops and mall retailers were all statistically cheap the entire way down to zero.",w:"The multiple falls as fast as the profits, so the discount never closes. The test is whether profits have stopped deteriorating \u2014 not whether the P/E is low."},tenbagger:{t:"Tenbagger",d:"Lynch's word for an investment that grows to ten times what you paid.",w:"A share can only fall 100% but can rise 1,000%. That asymmetry means a few big winners can carry many losers \u2014 provided you let winners run."},diworsification:{t:"Diworsification",d:"Lynch's term for a company buying unrelated businesses with shareholders' money instead of returning it.",ex:"A profitable software company buying a chain of gyms.",w:"It usually signals management has run out of good ideas in its core business and would rather build an empire than pay you."},"second-level thinking":{t:"Second-level thinking",d:"Marks's idea: don't just ask whether it's a good company, ask whether the price already assumes it's a good company.",ex:"First level: 'great business, buy it.' Second level: 'great business, but priced for perfection, so the likely return is poor.'",w:"You can't do what everyone else does and expect a different result. The edge lies in the gap between what people believe and what's true."},"Mr. Market":{t:"Mr. Market",d:"Graham's parable: imagine a moody business partner who turns up daily offering to buy your stake or sell you his \u2014 euphoric some days, terrified on others.",w:"He is there to serve you, not to instruct you. A falling price is his mood changing, which is only your problem if you choose to accept his offer."},"Graham number":{t:"Graham number",d:"A maximum price for cautious investors, combining Graham's two limits \u2014 never pay more than 15\xD7 annual profit, never more than 1.5\xD7 book value \u2014 into one number. The 22.5 in the formula is simply 15 \xD7 1.5.",f:"Graham number = \u221A(22.5 \xD7 EPS \xD7 book value per share)",ex:"EPS CHF 3, book value per share CHF 20 \u2192 22.5 \xD7 3 \xD7 20 = 1350 \u2192 \u221A1350 \u2248 CHF 36.74. At that price the P/E is 12.2 and the P/B is 1.84: cheap earnings paying for dear assets, which is the trade-off the formula allows.",w:"Letting one limit be breached when the other is low avoids rejecting good companies on a technicality. Useful for banks, industrials and property; useless for software and brands, whose real value never appears in book value."},"market cap":{t:"Market capitalisation",d:"The total price of the whole company: what you'd pay to buy every share.",f:"Market cap = share price \xD7 number of shares",ex:"10m shares at CHF 50 \u2192 CHF 500m.",w:"The share price alone is meaningless without this. A CHF 5 share isn't 'cheaper' than a CHF 500 share \u2014 it just has more shares outstanding."},buyback:{t:"Share buyback",d:"The company uses its cash to buy its own shares and cancel them, so each remaining share owns a bigger slice.",w:"Excellent when done at low prices, value-destroying when done at high ones. Most companies buy back most heavily at the top."},"position sizing":{t:"Position sizing",d:"Deciding how much money goes into a single investment.",w:"Size by conviction and by survivability. If a 60% fall in one holding would end your plan, that holding is too big \u2014 no matter how confident you feel."},benchmark:{t:"Benchmark",d:"The standard you measure yourself against \u2014 usually a global index fund.",w:"Without one, you can't tell skill from a rising tide. If you can't beat it over many years, the honest answer is to own more of it."},"pre-money":{t:"Pre-money / post-money valuation",d:"A startup's agreed value before new money goes in (pre) and after (post).",f:"Post-money = pre-money + amount raised",ex:"CHF 4m pre-money plus a CHF 1m raise \u2192 CHF 5m post-money. Your CHF 50,000 buys 1% of the post-money figure.",w:"Always check which one is being quoted. Confusing them can silently halve your stake."},dilution:{t:"Dilution",d:"Your ownership percentage shrinking when the company issues new shares in later funding rounds.",f:"New % = old % \xD7 (1 \u2212 share of new shares issued)",ex:"You own 10%. The company issues shares equal to 20% of the company \u2192 you now own 8%.",w:"It happens at every round. That's fine if the value of each remaining point rises more than your percentage falls."},SAFE:{t:"SAFE / convertible note",d:"A way of investing early without agreeing a valuation yet: your money converts into shares at the next proper funding round.",w:"Two terms decide everything \u2014 the valuation cap and the discount. Without a cap, you can fund a company early and receive almost nothing if it later raises at a huge valuation."},"valuation cap":{t:"Valuation cap",d:"The maximum valuation at which your early investment converts into shares, no matter how high the next round prices.",ex:"You invest with a CHF 5m cap. The next round happens at CHF 20m \u2014 you still convert as if the company were worth CHF 5m, so you get four times more shares.",w:"It's the single most important term for an early investor. Without it, your reward for taking the earliest risk gets competed away."},"pro-rata":{t:"Pro-rata rights",d:"The right to invest more in later rounds to keep your ownership percentage from shrinking.",w:"Only worth exercising if the company has genuinely improved. Following your money into a deteriorating business is how angels turn small losses into large ones."},"cap table":{t:"Cap table",d:"The list of who owns what percentage of a company.",w:"A messy one \u2014 big stakes held by people no longer involved \u2014 puts off future investors and can quietly kill a promising company."},ARR:{t:"ARR / MRR",d:"Annual and monthly recurring revenue: the predictable subscription income a company collects.",f:"ARR = MRR \xD7 12",ex:"CHF 30,000 a month \u2192 CHF 360,000 ARR.",w:"For software startups it's the main measure of real traction \u2014 but only if customers keep renewing. Check churn alongside it."},churn:{t:"Churn",d:"The percentage of customers who leave in a given period.",ex:"8% monthly churn means that after a year, most of the customers you started with are gone.",w:"High churn means growth is a leaking bucket: the company must keep buying new customers just to stand still."},"burn rate":{t:"Burn rate & runway",d:"Burn rate is how much cash a startup loses each month. Runway is how many months remain before it runs out.",f:"Runway = cash in bank \xF7 monthly burn",ex:"CHF 600,000 in the bank, burning CHF 50,000 a month \u2192 12 months of runway.",w:"Under six months and the founders are raising money from a position of weakness, which usually means bad terms for everyone."},"power law":{t:"Power law",d:"The pattern of startup returns: most investments return nothing, and one or two produce almost all the gains.",ex:"In twenty angel investments, ten may go to zero, seven return little, and one might return 30\xD7, paying for everything else.",w:"It's why angels make many small investments rather than a few large ones. With only five, you can easily catch none of the winners."},"unit economics":{t:"Unit economics",d:"Whether a single sale or single customer actually makes money once all the direct costs are counted.",ex:"A delivery marketplace taking CHF 4 per order but paying CHF 6 to the driver loses money on every order \u2014 growth makes it worse, not better.",w:"Companies with broken unit economics can look impressive while quietly destroying cash."},GMV:{t:"GMV & take rate",d:"GMV is the total value of goods sold through a marketplace. The take rate is the percentage the marketplace keeps.",ex:"CHF 10m of GMV at a 4% take rate \u2192 CHF 400,000 of actual revenue.",w:"Founders quote GMV because it's the bigger number. Only the take rate reaches the company."},liquidity:{t:"Liquidity / illiquidity",d:"How easily you can turn an investment back into cash.",w:"Shares are liquid \u2014 sold in seconds. Startup stakes are not: expect 7\u201312 years with no way out. Never invest money there that you might need."},"dry powder":{t:"Dry powder",d:"Cash held deliberately in reserve, ready to invest when opportunities appear.",w:"It looks lazy during a rising market and becomes the most valuable thing you own during a crash."},REIT:{t:"REIT",d:"A listed company that owns rental property and is required to pay out most of its income as dividends.",w:"Judge it on cash flow per share rather than reported profit, since property depreciation distorts accounting profits badly. Sensitive to interest rates."},"shares outstanding":{t:"Shares outstanding",d:"The total number of shares that exist.",w:"Watch it over time. If it keeps rising, your slice is being quietly diluted \u2014 often to pay staff in shares."},revenue:{t:"Revenue",d:"The total money coming in from sales, before any costs are deducted. Also called turnover or the top line.",w:"Revenue is vanity, profit is sanity, cash is reality. Plenty of high-revenue companies have never earned a franc."}},mF={"earnings per share":"EPS","P/E ratio":"P/E","price to earnings":"P/E","PEG ratio":"PEG","price to book":"P/B","return on equity":"ROE",moats:"moat","discounted cash flow":"DCF","cost of capital":"WACC","free cash flow":"free cash flow","capital expenditure":"capex","growth capex":"capex",depreciation:"D&A",amortisation:"D&A","depreciation & amortisation":"D&A","net profit":"net income",borrowings:"net debt","debt/EBITDA":"net debt","margin debt":"leverage",levered:"leverage","return on total capital":"return on capital",ROIC:"return on capital","debt/EBITDA":"net debt/EBITDA","leverage ratio":"net debt/EBITDA","net debt to EBITDA":"net debt/EBITDA","borrowed money":"leverage",dividends:"dividend",yield:"dividend yield",compound:"compounding",compounds:"compounding",drawdowns:"drawdown",volatile:"volatility",diversified:"diversification",diversification:"diversification",allocation:"asset allocation",rebalance:"rebalancing","index funds":"index fund",ETFs:"ETF","expense ratio":"TER",Umsatzabgabe:"stamp duty",Verrechnungssteuer:"withholding tax","pillar 3a":"S\xE4ule 3a","capital gain":"capital gains","professional securities dealer":"professional securities dealer",cyclicals:"cyclical",stalwarts:"stalwart","fast growers":"fast grower",turnarounds:"turnaround","asset plays":"asset play","value traps":"value trap",tenbaggers:"tenbagger","market capitalisation":"market cap","market capitalization":"market cap",buybacks:"buyback","share buyback":"buyback","post-money":"pre-money","pre-money valuation":"pre-money","post-money valuation":"pre-money",dilute:"dilution",diluted:"dilution","convertible note":"SAFE",SAFEs:"SAFE","pro-rata rights":"pro-rata",MRR:"ARR","recurring revenue":"ARR",runway:"burn rate","take rate":"GMV",illiquid:"liquidity",illiquidity:"liquidity",REITs:"REIT",payout:"payout ratio",intrinsic:"intrinsic value","discount to intrinsic value":"discount to value","fair value":"intrinsic value","second level":"second-level thinking"};var ue=(e,t)=>Math.floor(Math.random()*(t-e+1))+e,ye=e=>e[Math.floor(Math.random()*e.length)],se=e=>Math.round(e*100)/100,te=e=>e.toLocaleString("de-CH",{maximumFractionDigits:0}),He=e=>e.toLocaleString("de-CH",{minimumFractionDigits:2,maximumFractionDigits:2}),Xa=[{id:"rule72",name:"Rule of 72 \u2014 years to double",lesson:"1a",cat:"Compounding",gen:()=>{let e=ye([3,4,6,8,9,12,18]);return{q:`Your investments return ${e}% a year. Roughly how many years until your money doubles?`,a:72/e,tol:.4,unit:"years",steps:["Rule of 72: years \u2248 72 \xF7 annual return",`72 \xF7 ${e} = ${se(72/e)} years`,`So CHF 10,000 becomes about CHF 20,000 after ${se(72/e)} years, and CHF 40,000 after ${se(144/e)}.`]}}},{id:"rule72rev",name:"Rule of 72 \u2014 implied return",lesson:"1a",cat:"Compounding",gen:()=>{let e=ye([2,3,4,5,6,8,9,12]);return{q:`Someone promises to double your money in ${e} years. What annual return are they claiming?`,a:72/e,tol:.5,unit:"%",steps:["Run the rule backwards: return \u2248 72 \xF7 years",`72 \xF7 ${e} = ${se(72/e)}% a year`,e<=4?"That is far above what the best investors sustain long term. Treat the claim as a warning.":"Compare that against a global index at roughly 7% before deciding whether the risk is worth it."]}}},{id:"paw",name:"Expected net worth (Stanley)",lesson:"1b",cat:"Personal finance",gen:()=>{let e=ue(25,60),t=ue(4,16)*1e4;return{q:`You are ${e} and earn CHF ${te(t)} a year before tax. What is the expected net worth benchmark?`,a:e*t/10,tol:Math.max(500,e*t/10*.01),unit:"CHF",steps:["Expected net worth = age \xD7 annual pre-tax income \xF7 10",`${e} \xD7 ${te(t)} \xF7 10 = CHF ${te(e*t/10)}`,`Double that (CHF ${te(e*t/5)}) would make you a Prodigious Accumulator of Wealth.`]}}},{id:"cagr",name:"CAGR from start and end value",lesson:"7a",cat:"Compounding",gen:()=>{let e=ue(5,40)*1e3,t=ye([1.5,2,2.5,3,4]),r=ye([5,8,10,12,15]),a=Math.round(e*t),n=(Math.pow(a/e,1/r)-1)*100;return{q:`An investment grew from CHF ${te(e)} to CHF ${te(a)} over ${r} years. What was the annual return (CAGR)?`,a:n,tol:.5,unit:"%",steps:["CAGR = (end \xF7 start)^(1 \xF7 years) \u2212 1",`(${te(a)} \xF7 ${te(e)}) = ${se(a/e)}`,`${se(a/e)}^(1 \xF7 ${r}) \u2212 1 = ${se(n)}%`,"This is the only fair way to compare results over different time periods."]}}},{id:"recovery",name:"Recovering from a loss",lesson:"7a",cat:"Risk",gen:()=>{let e=ye([20,25,30,40,50,60,75]),t=(1/(1-e/100)-1)*100;return{q:`Your portfolio falls ${e}%. What percentage gain do you need just to get back to where you started?`,a:t,tol:.6,unit:"%",steps:["Gain needed = 1 \xF7 (1 \u2212 loss) \u2212 1",`1 \xF7 (1 \u2212 ${e/100}) \u2212 1 = ${se(t)}%`,`Losses are asymmetric: a ${e}% fall needs a ${se(t)}% rise. This is why avoiding disaster outranks chasing upside.`]}}},{id:"discount",name:"Discount to value",lesson:"2a",cat:"Valuation",gen:()=>{let e=ue(20,200),t=Math.round(e*(.4+Math.random()*.45)),r=(e-t)/e*100;return{q:`You estimate a share is worth CHF ${e}. It trades at CHF ${t}. What discount to value are you buying at?`,a:r,tol:1,unit:"%",steps:["Discount = (value \u2212 price) \xF7 value",`(${e} \u2212 ${t}) \xF7 ${e} = ${se(r)}%`,`Divide by the value, never the price. This is your error budget: your estimate could be ${Math.round(r)}% too optimistic and you still would not have overpaid.`]}}},{id:"upside",name:"Upside if price reaches value",lesson:"2a",cat:"Valuation",gen:()=>{let e=ue(40,200),t=Math.round(e*(.4+Math.random()*.4)),r=(e/t-1)*100;return{q:`You buy at CHF ${t} something you judge to be worth CHF ${e}. If the price eventually reaches your value, what is your gain?`,a:r,tol:1.5,unit:"%",steps:["Gain = value \xF7 price \u2212 1",`${e} \xF7 ${t} \u2212 1 = ${se(r)}%`,`Note the asymmetry: the discount is ${se((e-t)/e*100)}% but the gain is ${se(r)}%. The deeper the discount, the wider the two diverge.`]}}},{id:"graham",name:"Graham number",lesson:"2b",cat:"Valuation",gen:()=>{let e=se(1+Math.random()*8),t=ue(8,60),r=Math.sqrt(22.5*e*t);return{q:`EPS is CHF ${He(e)} and book value per share is CHF ${t}. What is the Graham number?`,a:r,tol:Math.max(.5,r*.02),unit:"CHF",steps:["Graham number = \u221A(22.5 \xD7 EPS \xD7 book value per share)","22.5 is just his two limits multiplied: 15\xD7 earnings \xD7 1.5\xD7 book",`22.5 \xD7 ${He(e)} \xD7 ${t} = ${te(22.5*e*t)}`,`\u221A${te(22.5*e*t)} = CHF ${He(r)} \u2014 the most a defensive investor should pay.`]}}},{id:"netdebt",name:"Net debt / EBITDA",lesson:"2b",cat:"Company health",gen:()=>{let e=ue(2,12)*100,t=ue(0,4)*50,r=ue(5,30)*10,a=(e-t)/r;return{q:`A company has CHF ${te(e)}m of debt, CHF ${te(t)}m of cash and EBITDA of CHF ${te(r)}m. What is its net debt / EBITDA?`,a,tol:.15,unit:"\xD7",steps:[`Net debt = debt \u2212 cash = ${te(e)} \u2212 ${te(t)} = CHF ${te(e-t)}m`,`Leverage = net debt \xF7 EBITDA = ${te(e-t)} \xF7 ${te(r)} = ${se(a)}\xD7`,a<2?"Under 2\xD7 \u2014 comfortable. The company can survive a bad year.":a<3?"Between 2\xD7 and 3\xD7 \u2014 manageable but worth watching.":a<4?"Above 3\xD7 \u2014 stretched. Little room for a downturn.":"Above 4\xD7 \u2014 the lenders effectively set the strategy, not management."]}}},{id:"pe",name:"P/E ratio",lesson:"3a",cat:"Valuation",gen:()=>{let e=se(.5+Math.random()*9),t=ue(6,40),r=se(e*t);return{q:`A share trades at CHF ${He(r)} and earns EPS of CHF ${He(e)}. What is its P/E ratio?`,a:r/e,tol:.4,unit:"\xD7",steps:["P/E = share price \xF7 EPS",`${He(r)} \xF7 ${He(e)} = ${se(r/e)}`,`You are paying ${se(r/e)} francs for every 1 franc of annual profit \u2014 about ${Math.round(r/e)} years of earnings at today's rate.`]}}},{id:"peg",name:"PEG ratio",lesson:"3b",cat:"Valuation",gen:()=>{let e=ue(8,45),t=ue(5,40),r=e/t;return{q:`A company trades on a P/E of ${e} and is growing earnings ${t}% a year. What is its PEG ratio?`,a:r,tol:.06,unit:"",steps:["PEG = P/E \xF7 growth rate",`${e} \xF7 ${t} = ${se(r)}`,r<1?"Below 1 \u2014 you are paying less than one point of P/E per point of growth. Lynch would look closer.":r<2?"Between 1 and 2 \u2014 fairly priced for the growth on offer.":"Above 2 \u2014 you are paying for growth that now has to actually arrive."]}}},{id:"roe",name:"Return on equity",lesson:"4a",cat:"Company health",gen:()=>{let e=ue(2,20)*50,t=ue(6,30),r=Math.round(e*t/100);return{q:`A company earns CHF ${te(r)}m of profit on shareholders' equity of CHF ${te(e)}m. What is its ROE?`,a:r/e*100,tol:.6,unit:"%",steps:["ROE = profit \xF7 shareholders' equity",`${te(r)} \xF7 ${te(e)} = ${se(r/e*100)}%`,"Buffett wants this consistently above 15% \u2014 but achieved without heavy debt, since borrowing inflates ROE while adding fragility."]}}},{id:"de",name:"Debt to equity",lesson:"4a",cat:"Company health",gen:()=>{let e=ue(1,10)*50,t=ye([.3,.5,.8,1.2,2,3]),r=Math.round(e*t);return{q:`A company has CHF ${te(r)}m of debt and CHF ${te(e)}m of shareholders' equity. What is its debt-to-equity ratio?`,a:r/e,tol:.08,unit:"",steps:["Debt/equity = total debt \xF7 shareholders' equity",`${te(r)} \xF7 ${te(e)} = ${se(r/e)}`,`That means CHF ${se(r/e)} borrowed for every CHF 1 the owners put in.`,r/e<1?"Below 1 \u2014 generally comfortable.":r/e<=2?"Above 1 \u2014 needs a stable business to support it.":`Around ${se(r/e)} is aggressive: the interest bill must be paid in bad years too.`]}}},{id:"epsgrow",name:"Projecting EPS forward",lesson:"4b",cat:"Valuation",gen:()=>{let e=se(1+Math.random()*8),t=ue(4,20),r=ye([5,10]),a=e*Math.pow(1+t/100,r);return{q:`EPS today is CHF ${He(e)}, growing ${t}% a year. What is EPS in ${r} years?`,a,tol:Math.max(.15,a*.03),unit:"CHF",steps:["Future EPS = today's EPS \xD7 (1 + growth)^years",`${He(e)} \xD7 (1 + ${t/100})^${r} = ${He(a)}`,"The earnings path is the signal; the multiple the market pays is mostly noise."]}}},{id:"owner",name:"Owner earnings",lesson:"5b",cat:"Company health",gen:()=>{let e=ue(4,30)*10,t=ue(1,8)*10,r=Math.max(10,Math.round((e+t)*(.2+Math.random()*.45)/10)*10),a=ue(0,3)*5,n=e+t-r-a;return{q:`Net profit CHF ${te(e)}m, depreciation CHF ${te(t)}m, maintenance capex CHF ${te(r)}m, working capital rose CHF ${te(a)}m. What are the owner earnings?`,a:n,tol:1,unit:"m CHF",steps:["Owner earnings = profit + depreciation \u2212 maintenance capex \u2212 working capital increase",`${te(e)} + ${te(t)} \u2212 ${te(r)} \u2212 ${te(a)} = CHF ${te(n)}m`,n<e?`Only CHF ${te(n)}m of the reported CHF ${te(e)}m actually reaches the owner \u2014 the rest is consumed keeping the business standing still.`:"Here owner earnings exceed reported profit, which usually means depreciation overstates real capital consumption."]}}},{id:"perpetuity",name:"Value of a flat cash flow",lesson:"5b",cat:"Valuation",gen:()=>{let e=ue(2,40)*5,t=ye([6,8,10,12,15]),r=e/(t/100);return{q:`A business produces CHF ${te(e)}m of cash a year, forever, with no growth. You require a ${t}% annual return. What is the most you can pay?`,a:r,tol:r*.02,unit:"m CHF",steps:["Value = annual cash flow \xF7 required return",`${te(e)} \xF7 ${t/100} = CHF ${te(r)}m`,`Pay more than CHF ${te(r)}m and you are simply accepting a return below ${t}%.`]}}},{id:"maxprice",name:"Maximum price for your hurdle",lesson:"4b",cat:"Valuation",gen:()=>{let e=se(1+Math.random()*6),t=ue(5,15),r=ue(10,20),a=ye([8,10,12,15]),n=e*Math.pow(1+t/100,10)*r,o=n/Math.pow(1+a/100,10);return{q:`EPS CHF ${He(e)}, growing ${t}% a year for 10 years, then valued at ${r}\xD7 earnings. You require ${a}% a year. What is the most you can pay today?`,a:o,tol:Math.max(1,o*.04),unit:"CHF",steps:[`Year-10 EPS = ${He(e)} \xD7 (1 + ${t/100})^10 = ${He(e*Math.pow(1+t/100,10))}`,`Year-10 price = ${He(e*Math.pow(1+t/100,10))} \xD7 ${r} = CHF ${He(n)}`,`Discount back: ${He(n)} \xF7 (1 + ${a/100})^10 = CHF ${He(o)}`,`Above CHF ${He(o)} you are accepting less than ${a}% a year. Use conservative growth \u2014 that is where optimism hides.`]}}},{id:"fees",name:"What a fee costs over time",lesson:"7b",cat:"Costs",gen:()=>{let e=ue(1,20)*1e4,t=ye([6,7,8]),r=ye([.2,.8,1.2,1.5,2]),a=ye([20,25,30,35]),n=e*Math.pow(1+(t-r)/100,a),o=e*Math.pow(1+t/100,a),i=o-n;return{q:`CHF ${te(e)} invested for ${a} years. The market returns ${t}% a year; your fund charges ${r}%. How many francs does the fee cost you in the end?`,a:i,tol:i*.04,unit:"CHF",steps:[`Without the fee: ${te(e)} \xD7 (1 + ${t/100})^${a} = CHF ${te(o)}`,`After the fee, you compound at ${se(t-r)}%: CHF ${te(n)}`,`Difference = CHF ${te(i)} \u2014 about ${Math.round(i/o*100)}% of the final value, gone to a ${r}% annual charge.`]}}},{id:"divyield",name:"Dividend yield",lesson:"8a",cat:"Income",gen:()=>{let e=ue(20,200),t=ye([1.5,2,2.5,3,4,5,6.5]),r=se(e*t/100);return{q:`A share costs CHF ${e} and pays an annual dividend of CHF ${He(r)}. What is the dividend yield?`,a:r/e*100,tol:.2,unit:"%",steps:["Yield = annual dividend \xF7 share price",`${He(r)} \xF7 ${e} = ${se(r/e*100)}%`,"Remember a very high yield is usually the market pricing in a cut, not a bargain."]}}},{id:"payout",name:"Payout ratio",lesson:"8a",cat:"Income",gen:()=>{let e=ue(10,60)*10,t=ye([.3,.45,.6,.85,1.1,1.3]),r=Math.round(e*t),a=r/e*100;return{q:`A company generates CHF ${te(e)}m of free cash flow and pays CHF ${te(r)}m in dividends. What is the payout ratio?`,a,tol:1.5,unit:"%",steps:["Payout ratio = dividends \xF7 free cash flow",`${te(r)} \xF7 ${te(e)} = ${se(a)}%`,a<=60?"Under 60% \u2014 comfortably covered.":a<=100?"Between 60% and 100% \u2014 little margin if profits dip.":"Above 100% \u2014 the dividend is being funded by debt or asset sales. A cut is coming, and the price usually falls with it."]}}},{id:"yieldoncost",name:"Yield on cost",lesson:"8a",cat:"Income",gen:()=>{let e=ue(20,100),t=ye([2,2.5,3,3.5]),r=ye([5,6,7,8,10]),a=ye([10,15,20]),n=se(e*t/100),o=n*Math.pow(1+r/100,a),i=o/e*100;return{q:`You buy at CHF ${e} with a CHF ${He(n)} dividend, growing ${r}% a year. After ${a} years, what is the yield on your original cost?`,a:i,tol:.6,unit:"%",steps:[`Future dividend = ${He(n)} \xD7 (1 + ${r/100})^${a} = CHF ${He(o)}`,`Yield on cost = ${He(o)} \xF7 ${e} (your original price) = ${se(i)}%`,`You started at ${t}% and ended at ${se(i)}% on the same money. Dividend growth, not starting yield, builds passive income.`]}}},{id:"withdrawal",name:"Capital needed for an income",lesson:"8b",cat:"Income",gen:()=>{let e=ue(2,10)*500,t=ye([3,3.5,4]),r=e*12/(t/100);return{q:`You want CHF ${te(e)} a month of passive income at a ${t}% sustainable withdrawal rate. What capital do you need?`,a:r,tol:r*.02,unit:"CHF",steps:[`Annual need = ${te(e)} \xD7 12 = CHF ${te(e*12)}`,`Capital = annual need \xF7 withdrawal rate = ${te(e*12)} \xF7 ${t/100} = CHF ${te(r)}`,"Working backwards from the number is the only way to know whether your savings rate is on track."]}}},{id:"dilution",name:"Dilution after a round",lesson:"9b",cat:"Startups",gen:()=>{let e=ye([2,5,8,10,12,15]),t=ye([10,15,20,25,30]),r=e*(1-t/100);return{q:`You own ${e}% of a startup. It issues new shares equal to ${t}% of the company. What do you own afterwards?`,a:r,tol:.15,unit:"%",steps:["New % = old % \xD7 (1 \u2212 share of new shares issued)",`${e} \xD7 (1 \u2212 ${t/100}) = ${se(r)}%`,"This applies at every round. Fine, so long as the value of each remaining point rises by more than your percentage falls."]}}},{id:"safecap",name:"SAFE valuation cap",lesson:"9b",cat:"Startups",gen:()=>{let e=ye([10,15,20,25,50])*1e3,t=ye([3,4,5,6,8]),r=t*ye([2,3,4]),a=e/(t*1e6)*100;return{q:`You invest CHF ${te(e)} on a SAFE with a CHF ${t}m valuation cap. The next round prices at CHF ${r}m. What percentage do you convert into?`,a,tol:.03,unit:"%",steps:[`The cap means you convert as if the company were worth CHF ${t}m, not CHF ${r}m`,`${te(e)} \xF7 ${t}m = ${se(a)}%`,`Without the cap you would have converted at CHF ${r}m and received only ${se(e/(r*1e6)*100)}% \u2014 the cap is worth ${se(r/t)}\xD7 to you.`]}}},{id:"runway",name:"Runway",lesson:"9a",cat:"Startups",gen:()=>{let e=ue(2,20)*5e4,t=ue(2,15)*1e4,r=e/t;return{q:`A startup has CHF ${te(e)} in the bank and burns CHF ${te(t)} a month. How many months of runway does it have?`,a:r,tol:.4,unit:"months",steps:["Runway = cash \xF7 monthly burn",`${te(e)} \xF7 ${te(t)} = ${se(r)} months`,r<6?"Under six months means the founders will be raising from a position of weakness \u2014 usually bad terms for everyone.":"Comfortable enough to raise on their own timetable rather than the bank's."]}}},{id:"valuetrap",name:"Discount or trap?",lesson:"5c",cat:"Judgement",concept:!0,gen:()=>{let e=Math.random()<.65,t=Math.random()<.5,r=Math.random()<.5,a=e?ue(4,9):ue(13,22),n=t?-ue(2,9):ue(2,9),o=se(r?3.4+Math.random()*2.2:.3+Math.random()*1.4),i=["A genuine discount \u2014 worth doing the work","A value trap \u2014 the multiple falls as fast as the profits","Quality at a fair price \u2014 fine, but no bargain","Possibly a turnaround, but only once something concrete changes"],s,l;return e&&t&&r?(s=1,l=`Cheap on ${a}\xD7 earnings, but sales are falling ${Math.abs(n)}% and net debt is ${o}\xD7 EBITDA. The debt removes any ability to wait, and the multiple will keep falling with the profits.`):e&&t&&!r?(s=3,l=`Cheap at ${a}\xD7 and the balance sheet is safe at ${o}\xD7 EBITDA, so it can survive \u2014 but sales still fall ${Math.abs(n)}% a year. Wait for a catalyst: new management, a disposal, a buyback at these prices.`):e&&!t?(s=0,l=`${a}\xD7 earnings with sales growing ${n}% and leverage of only ${o}\xD7 is the shape of a real discount. Something has stopped deteriorating \u2014 now do the work on why it is cheap.`):(s=2,l=`At ${a}\xD7 with ${n}% growth and ${o}\xD7 leverage, nothing here is mispriced. A decent business at a sensible price gives you the business's return, not a bargain's return.`),{type:"mc",q:`A company
